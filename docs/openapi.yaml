openapi: 3.0.3
info:
  title: gator API
  version: 0.1.0
  description: >
    HTTP surface of gator-server. Every route lives under /api/v1. Live updates are delivered
    over the WebSocket at /api/v1/ws (topics: inbox, task:<id>, job:<id>).
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: ready, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { description: not ready, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /version:
    get:
      operationId: version
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
  /capabilities:
    get:
      operationId: capabilities
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Capabilities" } } } }
  /auth/me:
    get:
      operationId: me
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /tokens:
    get:
      operationId: listTokens
      description: Tokens issued to the caller (users) or every runner/plugin token (workspace admins).
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Token" } } } } }
    post:
      operationId: createToken
      description: Mint a bearer token. Runner and plugin tokens require workspace admin; user tokens are for the caller.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewToken" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedToken" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /tokens/{tokenId}:
    delete:
      operationId: revokeToken
      parameters: [ { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: revoked }
        "403": { $ref: "#/components/responses/Error" }
  /devices:
    post:
      operationId: registerDevice
      description: Register this device for push notifications. Registering again refreshes it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewDevice" } } }
      responses:
        "200": { description: registered, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /devices/{deviceToken}:
    delete:
      operationId: forgetDevice
      description: Stop sending notifications to this device.
      parameters: [ { name: deviceToken, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: forgotten }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      description: Who works on this project and in which role.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } }
    put:
      operationId: setMember
      description: Set a user's role in a project. Requires project admin.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
      responses:
        "204": { description: ok }
        "403": { $ref: "#/components/responses/Error" }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
    post:
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProject" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}:
    get:
      operationId: getProject
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      description: "Removes a project for good. Refused once it holds a task: archive it instead, so its history survives. Workspace admins only."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      description: "Hides a project without losing anything: its tasks, receipts and metrics stay readable, its plugins stop. Send archived=false to bring it back."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveProject" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/repos:
    get:
      operationId: listProjectRepos
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectRepo" } } } } }
    put:
      operationId: putProjectRepo
      description: Add or update a repository by name. The primary repository is what runners check out. Requires project admin.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectRepo" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectRepo" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Task" } } } } }
    post:
      operationId: createTask
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewTask" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /plugins:
    get:
      operationId: listPlugins
      description: Installed plugins. Workspace admins only.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InstalledPlugin" } } } } }
  /plugins/{pluginName}:
    put:
      operationId: installPlugin
      description: Install or update a plugin from a command on the server. The command runs once to report its manifest. Workspace admins only.
      parameters: [ { $ref: "#/components/parameters/pluginName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstallPlugin" } } }
      responses:
        "200": { description: installed, content: { application/json: { schema: { $ref: "#/components/schemas/InstalledPlugin" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /knowledge:
    get:
      operationId: listWorkspaceKnowledge
      description: Technical entries shared by every project.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeEntry" } } } } }
    post:
      operationId: addWorkspaceKnowledge
      description: Write a workspace-wide entry. Workspace admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewKnowledgeEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /knowledge/{entryId}:
    delete:
      operationId: deleteKnowledgeEntry
      parameters: [ { name: entryId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /packs:
    get:
      operationId: listKnowledgePacks
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
    post:
      operationId: fetchKnowledgePacks
      description: Shallow-clone a registry and store every pack whose files match the checksum its index promises. Workspace admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FetchPacks" } } }
      responses:
        "200": { description: fetched, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/knowledge:
    get:
      operationId: listProjectKnowledge
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeEntry" } } } } }
    post:
      operationId: addProjectKnowledge
      description: Write an entry for this project. It overrides a workspace entry or a pack with the same scope and title.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewKnowledgeEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/packs:
    get:
      operationId: listProjectPacks
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
    put:
      operationId: setProjectPack
      description: Switch a pack on for this project, or move it in the order.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPack" } } }
      responses:
        "204": { description: enabled }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/packs/{packName}:
    delete:
      operationId: removeProjectPack
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: packName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: removed }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/knowledge/preview:
    get:
      operationId: previewKnowledge
      description: The technical part of a prompt as a job would receive it, with what one entry hides from another.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: role, in: query, required: true, schema: { type: string } }
        - { name: phase, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgePreview" } } } }
  /users:
    get:
      operationId: listUsers
      description: Everyone in the workspace. Workspace admins only.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/config:
    get:
      operationId: getProjectConfig
      description: "The project's process configuration: templates per kind of task, role prompts, the autopilot switch and the backend and budget policy."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
    put:
      operationId: setProjectConfig
      description: Replace the process configuration. Refused when a template or the policy would not hold. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/product:
    get:
      operationId: listProductContext
      description: What this project knows about its product. Never shared with other projects.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductEntry" } } } } }
    post:
      operationId: addProductEntry
      description: Write an entry. A person's entry is approved as it is written; agents propose instead.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProductEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /product/{entryId}:
    post:
      operationId: setProductEntryStatus
      description: Approve a proposal, or archive an entry that no longer holds.
      parameters: [ { name: entryId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductStatusChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntry" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /presets:
    get:
      operationId: listProjectPresets
      description: Starting points for a new project, shared by the whole workspace.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectPreset" } } } } }
    post:
      operationId: saveProjectPreset
      description: Saves a project as a preset. Workspace admins only; saving under an existing name replaces it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProjectPreset" } } }
      responses:
        "201": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPreset" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /presets/{presetId}:
    delete:
      operationId: deleteProjectPreset
      parameters: [ { name: presetId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/components:
    get:
      operationId: listComponents
      description: The parts this project is made of, with what each depends on.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
    put:
      operationId: putComponent
      description: Adds a component or updates it by key. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComponentInput" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/components/{key}:
    delete:
      operationId: deleteComponent
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/campaign:
    get:
      operationId: getCampaign
      description: "How far a campaign has got: every target, what became of it, and the totals."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addCampaignTargets
      description: Gives a campaign the places it has to reach, one task per target. Adding a target it already has does nothing.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CampaignTargets" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/campaign/skip:
    post:
      operationId: skipCampaignTarget
      description: Drops one target, with a reason. Its task is closed; approving the campaign needs every target finished or skipped.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkipTarget" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/component:
    put:
      operationId: setTaskComponent
      description: "Says which part of the product a task is about; the job's prompt then carries that part, its neighbours and its decisions. Null clears it."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskComponent" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/releases:
    get:
      operationId: listReleases
      description: What reached each environment, newest first, and whether its observation window is still open.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Release" } } } } }
  /projects/{projectId}/incidents:
    get:
      operationId: listIncidents
      description: What production said went wrong, open ones first.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } }
  /projects/{projectId}/quality:
    get:
      operationId: listQuality
      description: "The project's scorecard: each component's score, how it moved since the last sweep, and the rules behind it."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scorecard" } } } } }
    post:
      operationId: scoreNow
      description: Runs the scorecard at once instead of waiting for the daily sweep. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scorecard" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/templates:
    get:
      operationId: listProjectTemplates
      description: The project's process for each kind of task, in phase order. Phases that need a plugin capability the project lacks are listed as inactive.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectTemplate" } } } } }
  /projects/{projectId}/plugins:
    get:
      operationId: listProjectPlugins
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectPlugin" } } } } }
  /projects/{projectId}/plugins/{pluginName}:
    put:
      operationId: configureProjectPlugin
      description: Enable, disable or configure a plugin for the project. Secret settings are write-only; leaving one out keeps its value, an empty string removes it. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/pluginName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPluginSettings" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPlugin" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/plugins/{pluginName}/calls:
    get:
      operationId: listPluginCalls
      description: Recent calls between the core and the plugin for this project, secrets redacted. Project admins only.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { $ref: "#/components/parameters/pluginName" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PluginCall" } } } } }
  /tasks/{taskId}/plugin-ui:
    get:
      operationId: getTaskPluginUI
      description: Markdown tabs and chips the project's plugins contribute to a task.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/PluginUI" } } } }
  /inbox:
    get:
      operationId: listInbox
      description: Decisions waiting for a human, most urgent first.
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          required: false
          description: only tasks handed to the caller
          schema: { type: boolean }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Decision" } } } } }
  /tasks/{taskId}:
    get:
      operationId: getTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/approve:
    post:
      operationId: approveTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/advance:
    post:
      operationId: advanceTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/rollback:
    post:
      operationId: rollbackTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Rollback" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/handoff:
    post:
      operationId: handoffTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/checks:
    put:
      operationId: setTaskCheck
      description: Record an automated verdict on the current gate. Used by plugins.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Check" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/usage:
    post:
      operationId: recordTaskUsage
      description: >
        Record tokens, cost and agent time for work done on a task. Runners send one record per
        job; plugins and people may report too. Repeating an idempotencyKey for the same task is a no-op.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UsageInput" } } }
      responses:
        "201": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/UsageAck" } } } }
        "200": { description: "duplicate idempotencyKey, nothing recorded", content: { application/json: { schema: { $ref: "#/components/schemas/UsageAck" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/metrics:
    get:
      operationId: getTaskMetrics
      description: Time and token accounting for one task, total and per phase.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TaskMetrics" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/budget:
    get:
      operationId: getProjectBudget
      description: "The daily limit and what has been spent against it since the start of the current UTC day — the same numbers the budget gate check uses."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
  /projects/{projectId}/metrics:
    get:
      operationId: getProjectMetrics
      description: Aggregates per task kind for tasks created since the given time (default 30 days).
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMetrics" } } } }
  /tasks/{taskId}/artifacts:
    get:
      operationId: listTaskArtifacts
      description: Documents the task's phases produced (brief, plan, report, review), every version.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
  /tasks/{taskId}/jobs:
    get:
      operationId: listTaskJobs
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Job" } } } } }
    post:
      operationId: createTaskJob
      description: Queue an agent job for the task's current phase. Role defaults to the phase's runner role.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewJob" } } }
      responses:
        "201": { description: queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      description: Stored agent output after the given sequence number. Live output streams on the WebSocket topic job:<id>.
      parameters:
        - { $ref: "#/components/parameters/jobId" }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JobEvent" } } } } }
  /jobs/{jobId}/stop:
    post:
      operationId: stopJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/StopJob" } } }
      responses:
        "202": { description: stop requested or done, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/steer:
    post:
      operationId: steerJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SteerJob" } } }
      responses:
        "202": { description: delivered to the runner }
        "409": { $ref: "#/components/responses/Error" }
  /runners:
    get:
      operationId: listRunners
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunnerInfo" } } } } }
  /runners/{runnerId}/login:
    post:
      operationId: requestRunnerLogin
      description: Ask a connected runner to start a backend login; the URL and code arrive on the WebSocket topic runner:<id>.
      parameters: [ { $ref: "#/components/parameters/runnerId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "202": { description: requested }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/transitions:
    get:
      operationId: listTaskTransitions
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transition" } } } } }
components:
  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    taskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    jobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    runnerId: { name: runnerId, in: path, required: true, schema: { type: string, format: uuid } }
    pluginName: { name: pluginName, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string } }
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Readiness:
      type: object
      required: [checks]
      properties: { checks: { type: object, additionalProperties: { type: string } } }
    Version:
      type: object
      required: [version, commit, date]
      properties: { version: { type: string }, commit: { type: string }, date: { type: string } }
    Capabilities:
      type: object
      required: [features, protocolVersion]
      properties:
        features: { type: array, items: { type: string } }
        protocolVersion: { type: integer }
    ProjectRepo:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, description: "https://, ssh (git@host:path), file:// or an absolute path" }
        defaultBranch: { type: string }
        primary: { type: boolean }
    NewJob:
      type: object
      properties:
        backend: { type: string, description: "claude | codex | pi; defaults to the project's policy for the role" }
        model: { type: string, description: "defaults to the policy's model when the backend is the policy's" }
        maxCostUsd: { type: number, format: double, minimum: 0, description: "cost cap for this job; defaults to the policy's" }
        instruction: { type: string }
        role: { type: string }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        timeoutSeconds: { type: integer, minimum: 60 }
        maxToolCalls: { type: integer, minimum: 1 }
    Job:
      type: object
      required: [id, taskId, projectId, phase, role, backend, instruction, status, attempts, maxAttempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        phase: { type: string }
        role: { type: string }
        backend: { type: string }
        model: { type: string }
        instruction: { type: string }
        status: { type: string, enum: [queued, leased, running, stalled, done, failed, stopped] }
        runnerId: { type: string, format: uuid }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        leaseExpiresAt: { type: string, format: date-time }
        lastEventAt: { type: string, format: date-time }
        stopReason: { type: string }
        receipt: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    JobEvent:
      type: object
      required: [seq, type, at, payload]
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string }
        at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    StopJob:
      type: object
      properties: { reason: { type: string } }
    SteerJob:
      type: object
      required: [message]
      properties: { message: { type: string } }
    LoginRequest:
      type: object
      required: [backend]
      properties: { backend: { type: string } }
    RunnerCapabilities:
      type: object
      required: [backends, maxParallel, projects]
      properties:
        backends: { type: array, items: { type: string } }
        maxParallel: { type: integer }
        projects: { type: array, items: { type: string } }
    RunnerInfo:
      type: object
      required: [id, name, location, status, connected, capabilities, authState, protocolVersion, binaryVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        location: { type: string }
        status: { type: string, enum: [online, busy, offline] }
        connected: { type: boolean }
        capabilities: { $ref: "#/components/schemas/RunnerCapabilities" }
        authState: { type: object, additionalProperties: { type: string } }
        protocolVersion: { type: integer }
        binaryVersion: { type: string }
        lastHeartbeatAt: { type: string, format: date-time }
        offlineSince: { type: string, format: date-time, description: "when it stopped answering; absent while it is connected" }
        offlineReason: { type: string, description: "disconnected, or no heartbeat" }
    UsageInput:
      type: object
      required: [durationMs]
      properties:
        jobId: { type: string, format: uuid }
        phase: { type: string, description: defaults to the task's current phase }
        backend: { type: string }
        model: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadTokens: { type: integer, format: int64, minimum: 0 }
        cacheWriteTokens: { type: integer, format: int64, minimum: 0 }
        costUsd: { type: number, format: double, minimum: 0 }
        costEstimated: { type: boolean, description: true when priced from list rates (subscriptions) }
        durationMs: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    UsageAck:
      type: object
      required: [recorded]
      properties: { recorded: { type: boolean } }
    Tokens:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    PhaseMetrics:
      type: object
      required: [phase, owner, visits, seconds, blockedSeconds, agentSeconds, workSeconds, queueSeconds, waitingSeconds, tokens, costUsd, jobs]
      properties:
        phase: { type: string }
        owner: { type: string, description: "human | runner | plugin, from the template" }
        visits: { type: integer, description: times the task entered this phase (rollbacks add visits) }
        seconds: { type: number, format: double, description: wall time spent in the phase }
        blockedSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double, description: time agents ran during this phase }
        workSeconds: { type: number, format: double, description: job wall time from start to finish }
        queueSeconds: { type: number, format: double, description: jobs waiting for a runner }
        waitingSeconds: { type: number, format: double, description: "rest of the phase time, waiting for a person" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        jobs: { type: integer }
    TaskMetrics:
      type: object
      required: [taskId, closed, leadSeconds, blockedSeconds, agentSeconds, workSeconds, queueSeconds, waitingSeconds, state, tokens, costUsd, costEstimated, jobs, phases]
      properties:
        taskId: { type: string, format: uuid }
        closed: { type: boolean }
        leadSeconds: { type: number, format: double, description: "created to closed, or to now while open" }
        blockedSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double }
        workSeconds: { type: number, format: double, description: "lead = work + queue + blocked + waiting" }
        queueSeconds: { type: number, format: double }
        waitingSeconds: { type: number, format: double, description: nobody working; the task waits for a person }
        state: { $ref: "#/components/schemas/TaskState" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        costEstimated: { type: boolean, description: true if any part of the cost is an estimate }
        jobs: { type: integer }
        phases: { type: array, items: { $ref: "#/components/schemas/PhaseMetrics" } }
    TaskState:
      type: object
      required: [kind, since]
      properties:
        kind: { type: string, enum: [closed, blocked, agent_stalled, agent_working, queued, waiting_for_human] }
        since: { type: string, format: date-time }
    KindMetrics:
      type: object
      required: [kind, tasks, closedTasks, avgLeadSeconds, agentSeconds, tokens, costUsd, jobs]
      properties:
        kind: { type: string }
        tasks: { type: integer, format: int64 }
        closedTasks: { type: integer, format: int64 }
        avgLeadSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        jobs: { type: integer, format: int64 }
    Budget:
      type: object
      required: [dailyLimitUsd, spentTodayUsd, estimated]
      properties:
        dailyLimitUsd: { type: number, format: double, description: "0 means no limit is set" }
        spentTodayUsd: { type: number, format: double }
        estimated: { type: boolean, description: "true while any of the spend comes from a subscription, where cost is an estimate" }
    ProjectMetrics:
      type: object
      required: [projectId, since, byKind, totals]
      properties:
        projectId: { type: string, format: uuid }
        since: { type: string, format: date-time }
        byKind: { type: array, items: { $ref: "#/components/schemas/KindMetrics" } }
        totals: { $ref: "#/components/schemas/KindMetrics" }
    Me:
      type: object
      required: [kind, name, workspaceRole]
      properties:
        kind: { type: string }
        userId: { type: string, format: uuid }
        name: { type: string }
        workspaceRole: { type: string }
        scope: { type: string }
    NewToken:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [user, runner, plugin] }
        name: { type: string }
        projectId: { type: string, format: uuid, description: required for plugin tokens }
        ttlHours: { type: integer }
    Token:
      type: object
      required: [id, kind, scope, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        scope: { type: string }
        name: { type: string }
        projectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    IssuedToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "plaintext, shown once" }
    Member:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [admin, member, viewer] }
    NewProject:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        preset: { type: string, description: "name of a project preset to start from; its vision, principles, process, packs and repository are copied, never shared" }
    # A saved starting point for a new project. Named "preset" because "template" already
    # means the process template per kind of task, and two meanings for one word in an API is
    # a bug waiting to be written.
    ProjectPreset:
      type: object
      required: [id, name, description, packs, product, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        packs: { type: array, items: { type: string }, description: "knowledge packs a project from this template switches on" }
        product: { type: array, items: { $ref: "#/components/schemas/PresetEntry" } }
        repoUrl: { type: string, description: "repository a new project starts with, if any" }
        hasProcess: { type: boolean, description: "whether the template carries a process configuration" }
        createdAt: { type: string, format: date-time }
    PresetEntry:
      type: object
      required: [kind, title, content]
      properties:
        kind: { type: string }
        title: { type: string }
        content: { type: string }
    NewProjectPreset:
      type: object
      required: [name, fromProjectId]
      properties:
        name: { type: string }
        description: { type: string }
        fromProjectId: { type: string, format: uuid, description: "the project to snapshot" }
    ArchiveProject:
      type: object
      required: [archived]
      properties:
        archived: { type: boolean }
    Project:
      type: object
      required: [id, slug, name, tags, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, description: "set while the project is archived" }
    NewDevice:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: APNs device token }
        platform: { type: string, enum: [ios, macos] }
        appVersion: { type: string }
    Device:
      type: object
      required: [id, platform, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeEntry:
      type: object
      required: [id, scope, title, content, position, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: absent for a workspace-wide entry }
        scope: { type: string, enum: [language, architecture, requirements, testing, security] }
        title: { type: string }
        content: { type: string }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    NewKnowledgeEntry:
      type: object
      required: [scope, title, content]
      properties:
        scope: { type: string, enum: [language, architecture, requirements, testing, security] }
        title: { type: string }
        content: { type: string }
        position: { type: integer }
    KnowledgePack:
      type: object
      required: [id, name, version, scope, checksum, files]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        scope: { type: string }
        url: { type: string }
        checksum: { type: string }
        appliesTo: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
        phases: { type: array, items: { type: string } }
        files: { type: array, items: { type: string } }
        enabled: { type: boolean, description: present when listed for a project }
        fetchedAt: { type: string, format: date-time }
    FetchPacks:
      type: object
      required: [url]
      properties:
        url: { type: string, description: git url of the registry }
    ProjectPack:
      type: object
      required: [name]
      properties:
        name: { type: string }
        version: { type: string, description: defaults to the newest stored }
        position: { type: integer }
    KnowledgePreview:
      type: object
      required: [documents, warnings, bytes]
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/PreviewDocument" } }
        warnings: { type: array, items: { type: string } }
        bytes: { type: integer, description: size of the technical part of the prompt }
    PreviewDocument:
      type: object
      required: [title, scope, body]
      properties:
        title: { type: string }
        scope: { type: string }
        body: { type: string }
    User:
      type: object
      required: [id, name, email, workspaceRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        workspaceRole: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
    ProjectMember:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, member, viewer] }
    ProjectConfig:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: true, description: "process_config as stored: templates, roles, autopilot, policy" }
    Campaign:
      type: object
      required: [targets, done, blocked, waiting, skipped]
      properties:
        targets: { type: array, items: { $ref: "#/components/schemas/CampaignTarget" } }
        done: { type: integer }
        blocked: { type: integer }
        waiting: { type: integer }
        skipped: { type: integer }
    CampaignTarget:
      type: object
      required: [key, skipped]
      properties:
        key: { type: string, description: "a component key, or another project's slug" }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        title: { type: string }
        phase: { type: string }
        closed: { type: boolean }
        blocked: { type: string, description: "why this target cannot move; empty when it can" }
        skipped: { type: boolean }
        skipReason: { type: string }
    CampaignTargets:
      type: object
      required: [targets]
      properties:
        instruction: { type: string, description: "carried into every target's task, so an agent has the whole decision" }
        targets: { type: array, items: { $ref: "#/components/schemas/CampaignTargetInput" } }
    CampaignTargetInput:
      type: object
      required: [key]
      properties:
        key: { type: string }
        projectId: { type: string, format: uuid, description: "another project; default: the campaign's own" }
        title: { type: string }
        kind: { type: string, enum: [feature, bug, incident, chore], description: "default chore" }
    SkipTarget:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    Scorecard:
      type: object
      required: [component, earned, possible, checks]
      properties:
        component: { type: string, description: "component key; empty means the project as a whole" }
        componentName: { type: string }
        earned: { type: integer }
        possible: { type: integer }
        previousEarned: { type: integer, description: "the score before this one, for the trend" }
        previousPossible: { type: integer }
        checkedAt: { type: string, format: date-time }
        checks: { type: array, items: { $ref: "#/components/schemas/QualityCheck" } }
    QualityCheck:
      type: object
      required: [rule, source, status, weight]
      properties:
        rule: { type: string }
        source: { type: string, description: "builtin, or the plugin that answered" }
        status: { type: string, enum: [pass, fail, unknown] }
        detail: { type: string }
        weight: { type: integer }
        failingSince: { type: string, format: date-time }
        taskId: { type: string, format: uuid, description: "the task opened about this slip" }
    Release:
      type: object
      required: [id, version, environment, deployedAt, watching]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        version: { type: string }
        commitSha: { type: string }
        url: { type: string }
        environment: { type: string }
        deployedAt: { type: string, format: date-time }
        observationUntil: { type: string, format: date-time, description: "when it stops being watched" }
        settledAt: { type: string, format: date-time, description: "set once the window passed with nothing reported" }
        watching: { type: boolean, description: "the window is still open" }
        openIncidents: { type: integer, description: "faults still open against this release" }
    Incident:
      type: object
      required: [id, fingerprint, title, severity, count, firstSeenAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        fingerprint: { type: string, description: "what makes one fault one incident" }
        title: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        url: { type: string }
        count: { type: integer, description: "how many times it has been reported" }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    Component:
      type: object
      required: [id, key, name, kind, dependsOn, usedBy, decisions]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: "short handle, unique in the project" }
        name: { type: string }
        kind: { type: string, enum: [app, api, lib, infra] }
        repo: { type: string }
        path: { type: string }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        notes: { type: string }
        dependsOn: { type: array, items: { type: string }, description: "keys of components this one needs" }
        usedBy: { type: array, items: { type: string }, description: "keys of components a change here reaches" }
        decisions: { type: array, items: { $ref: "#/components/schemas/ProductEntry" }, description: "approved decisions that shaped it" }
    ComponentInput:
      type: object
      required: [key, name, kind]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [app, api, lib, infra] }
        repo: { type: string }
        path: { type: string }
        ownerId: { type: string, format: uuid }
        notes: { type: string }
        dependsOn: { type: array, items: { type: string }, description: "replaces the dependencies; keys must exist in this project" }
        decisions: { type: array, items: { type: string, format: uuid }, description: "replaces the linked decisions" }
    TaskComponent:
      type: object
      properties:
        key: { type: string, description: "component key, or absent to clear" }
    ProductEntry:
      type: object
      required: [id, kind, title, content, version, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [vision, principles, persona, glossary, decision, lesson, roadmap] }
        title: { type: string }
        content: { type: string }
        version: { type: integer }
        status: { type: string, enum: [proposed, approved, archived] }
        sourceTaskId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
    NewProductEntry:
      type: object
      required: [kind, title, content]
      properties:
        kind: { type: string, enum: [vision, principles, persona, glossary, decision, lesson, roadmap] }
        title: { type: string }
        content: { type: string }
    ProductStatusChange:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, archived] }
    ProjectTemplate:
      type: object
      required: [kind, maxRollbacks, phases]
      properties:
        kind: { type: string }
        maxRollbacks: { type: integer }
        phases: { type: array, items: { $ref: "#/components/schemas/TemplatePhase" } }
    TemplatePhase:
      type: object
      required: [name, owner, gate, active]
      properties:
        name: { type: string }
        owner: { type: string, description: "human | runner | plugin" }
        role: { type: string, description: runner role for this phase }
        gate: { type: string, description: "human | auto | both" }
        requires: { type: string, description: plugin capability that activates the phase }
        active: { type: boolean }
    InstallPlugin:
      type: object
      required: [command]
      properties:
        command: { type: array, minItems: 1, items: { type: string }, description: "argv of the plugin process on the server" }
    InstalledPlugin:
      type: object
      required: [name, version, command, capabilities, hooks, enabled]
      properties:
        name: { type: string }
        version: { type: string }
        command: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        hooks: { type: array, items: { type: string } }
        enabled: { type: boolean }
        manifest: { type: object, additionalProperties: true }
    ProjectPluginSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
    ProjectPlugin:
      type: object
      required: [name, version, enabled, running, capabilities, hooks, config, secretsSet]
      properties:
        name: { type: string }
        version: { type: string }
        enabled: { type: boolean }
        disabledReason: { type: string }
        running: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        hooks: { type: array, items: { type: string } }
        ui: { type: array, items: { type: string } }
        config: { type: object, additionalProperties: true, description: non-secret settings }
        secretsSet: { type: array, items: { type: string }, description: secret settings that hold a value }
        configSchema: { type: object, additionalProperties: true }
    PluginCall:
      type: object
      required: [id, direction, method, durationMs, createdAt]
      properties:
        id: { type: integer, format: int64 }
        direction: { type: string, description: "core_to_plugin | plugin_to_core" }
        method: { type: string }
        payload: {}
        result: {}
        error: { type: string }
        durationMs: { type: integer }
        createdAt: { type: string, format: date-time }
    PluginUI:
      type: object
      required: [tabs, chips]
      properties:
        tabs: { type: array, items: { $ref: "#/components/schemas/PluginTab" } }
        chips: { type: array, items: { $ref: "#/components/schemas/PluginChip" } }
    PluginTab:
      type: object
      required: [plugin, title, markdown]
      properties:
        plugin: { type: string }
        title: { type: string }
        markdown: { type: string }
    PluginChip:
      type: object
      required: [plugin, text]
      properties:
        plugin: { type: string }
        text: { type: string }
        color: { type: string }
        url: { type: string }
    NewTask:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [feature, bug, incident, chore, campaign] }
        title: { type: string }
        description: { type: string, description: "what the person wants, in their words; jobs get it in their prompt" }
        urgency: { type: integer, minimum: 1, maximum: 4 }
    Artifact:
      type: object
      required: [id, phase, type, version, approved, createdAt]
      properties:
        id: { type: string, format: uuid }
        phase: { type: string }
        type: { type: string }
        version: { type: integer }
        content: { type: string }
        url: { type: string }
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, projectId, kind, title, phase, urgency, requirementsChanged, phaseEnteredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        description: { type: string }
        phase: { type: string }
        urgency: { type: integer }
        ownerKind: { type: string }
        ownerId: { type: string, format: uuid }
        requirementsChanged: { type: boolean }
        blockedReason: { type: string }
        phaseEnteredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [gate, phases]
          properties:
            gate: { $ref: "#/components/schemas/Gate" }
            phases: { type: array, items: { type: string }, description: active phases of this task's template in order }
    Gate:
      type: object
      required: [phase, kind, checks, humanApproved]
      properties:
        phase: { type: string }
        kind: { type: string, enum: [human, auto, both] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        humanApproved: { type: boolean }
        blockedReason: { type: string }
        blockedBy: { type: string }
    Check:
      type: object
      required: [name, source, status]
      properties:
        name: { type: string }
        source: { type: string }
        status: { type: string, enum: [pass, fail, pending] }
        detail: { type: string }
    Decision:
      type: object
      required: [task, waitingSince, reason]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        waitingSince: { type: string, format: date-time }
        reason: { type: string, enum: [approval, blocked, requirements_changed, idea, job_failed, no_runner] }
        rollbacks: { type: integer, description: times this task was sent back into its current phase }
    Reason:
      type: object
      properties: { reason: { type: string } }
    Rollback:
      type: object
      required: [to, reason]
      properties: { to: { type: string }, reason: { type: string } }
    Handoff:
      type: object
      required: [toKind, toId]
      properties:
        toKind: { type: string, enum: [user, runner] }
        toId: { type: string, format: uuid }
        reason: { type: string }
    Transition:
      type: object
      required: [id, toPhase, kind, actorKind, createdAt]
      properties:
        id: { type: integer, format: int64 }
        fromPhase: { type: string }
        toPhase: { type: string }
        kind: { type: string }
        actorKind: { type: string }
        actorId: { type: string, format: uuid }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
