openapi: 3.0.3
info:
  title: gator API
  version: 0.1.0
  description: >
    HTTP surface of gator-server. Every route lives under /api/v1. Live updates are delivered
    over the WebSocket at /api/v1/ws (topics: inbox, task:<id>, job:<id>, project:<id>,
    conversation:<id>, me). On every topic, an event that belongs to a project reaches only
    callers who may read that project, and an event about a conversation only callers who may
    read that conversation; subscribing to project:<id> or conversation:<id> without that right
    closes the socket. "me" follows what concerns the caller: conversation events whose audience
    names them (messages and unread in conversations they are in, mentions, DMs). Conversation
    events carry ids and seq, never message bodies; a client reads the messages after its last
    seq. A client sends {"typing":"<conversationId>"} to say it is typing; the others in the
    conversation get a conversation.typing event, which is never stored.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: ready, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { description: not ready, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /version:
    get:
      operationId: version
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
  /capabilities:
    get:
      operationId: capabilities
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Capabilities" } } } }
  /auth/me:
    get:
      operationId: me
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /tokens:
    get:
      operationId: listTokens
      description: Tokens issued to the caller (users) or every runner/plugin token (workspace admins).
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Token" } } } } }
    post:
      operationId: createToken
      description: Mint a bearer token. Runner and plugin tokens require workspace admin; user tokens are for the caller.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewToken" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedToken" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /tokens/{tokenId}:
    delete:
      operationId: revokeToken
      parameters: [ { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: revoked }
        "403": { $ref: "#/components/responses/Error" }
  /devices:
    post:
      operationId: registerDevice
      description: Register this device for push notifications. Registering again refreshes it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewDevice" } } }
      responses:
        "200": { description: registered, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /devices/{deviceToken}:
    delete:
      operationId: forgetDevice
      description: Stop sending notifications to this device.
      parameters: [ { name: deviceToken, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: forgotten }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      description: Who works on this project and in which role.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } }
    put:
      operationId: setMember
      description: "Set a user's role in a project. Requires project admin. Refused (409) when it would leave the project without an admin."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
      responses:
        "204": { description: ok }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/members/{userId}:
    delete:
      operationId: removeMember
      description: "Take a person out of a project. Requires project admin, except that anyone may leave. Refused (409) for the last admin."
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/candidates:
    get:
      operationId: listProjectCandidates
      description: "People already in the workspace, not yet in this project, whose name or email contains q. At most ten, with nothing but name and email. Requires project admin."
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectCandidate" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/invitations:
    get:
      operationId: listInvitations
      description: "Invitations nobody has accepted or revoked yet, expired ones included. Requires project admin."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      description: "Invite a person by email. The answer carries the link to pass on; it is shown once. Inviting the same address again replaces its open invitation. Requires project admin."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewInvitation" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedInvitation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      description: The invitation's link stops working. Requires project admin.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { $ref: "#/components/parameters/invitationId" }
      responses:
        "204": { description: revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/invitations/{invitationId}/renew:
    post:
      operationId: renewInvitation
      description: "A fresh link and a fresh expiry for an open invitation; the old link stops working. Only the token's hash is stored, so this is how an admin gets a link to copy again. Requires project admin."
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { $ref: "#/components/parameters/invitationId" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedInvitation" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      description: "The signed-in person joins the project they were invited to. The invitation must have been sent to their email (403 otherwise); an unknown, revoked or expired one answers 404. Signing in with the invited address accepts it too, without this call."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AcceptInvitation" } } }
      responses:
        "200": { description: joined, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
    post:
      operationId: createProject
      description: "Any signed-in person may create a project; they become its admin. A repository given here becomes the primary one, over any the preset carries."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProject" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}:
    get:
      operationId: getProject
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      description: "Removes a project for good. Refused once it holds a task: archive it instead, so its history survives. Workspace admins only."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      description: "Hides a project without losing anything: its tasks, receipts and metrics stay readable, its plugins stop. Send archived=false to bring it back. Requires project admin."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveProject" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/repos:
    get:
      operationId: listProjectRepos
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectRepo" } } } } }
    put:
      operationId: putProjectRepo
      description: Add or update a repository by name. The primary repository is what runners check out. Requires project admin.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectRepo" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectRepo" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/repos/{repoName}:
    delete:
      operationId: deleteProjectRepo
      description: Forget a repository. The primary one can go only when it is the last, or once another is made primary. Requires project admin.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { name: repoName, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Task" } } } } }
    post:
      operationId: createTask
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewTask" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /plugins:
    get:
      operationId: listPlugins
      description: Installed plugins. Workspace admins only.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InstalledPlugin" } } } } }
  /plugins/catalogue:
    get:
      operationId: listPluginCatalogue
      description: The plugins this server ships. A project admin switches one on with configureProjectPlugin; the first project to do so installs it, with no command line.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CataloguePlugin" } } } } }
  /plugins/{pluginName}:
    put:
      operationId: installPlugin
      description: Install or update a plugin from a command on the server. The command runs once to report its manifest. Workspace admins only.
      parameters: [ { $ref: "#/components/parameters/pluginName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstallPlugin" } } }
      responses:
        "200": { description: installed, content: { application/json: { schema: { $ref: "#/components/schemas/InstalledPlugin" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /knowledge:
    get:
      operationId: listWorkspaceKnowledge
      description: Technical entries shared by every project.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeEntry" } } } } }
    post:
      operationId: addWorkspaceKnowledge
      description: Write a workspace-wide entry. Workspace admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewKnowledgeEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /knowledge/{entryId}:
    delete:
      operationId: deleteKnowledgeEntry
      parameters: [ { name: entryId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /packs:
    get:
      operationId: listKnowledgePacks
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
    post:
      operationId: fetchKnowledgePacks
      description: Shallow-clone a registry and store every pack whose files match the checksum its index promises. Workspace admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FetchPacks" } } }
      responses:
        "200": { description: fetched, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/knowledge:
    get:
      operationId: listProjectKnowledge
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeEntry" } } } } }
    post:
      operationId: addProjectKnowledge
      description: Write an entry for this project. It overrides a workspace entry or a pack with the same scope and title.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewKnowledgeEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/packs:
    get:
      operationId: listProjectPacks
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgePack" } } } } }
    put:
      operationId: setProjectPack
      description: Switch a pack on for this project, or move it in the order.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPack" } } }
      responses:
        "204": { description: enabled }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/packs/{packName}:
    delete:
      operationId: removeProjectPack
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: packName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: removed }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/knowledge/preview:
    get:
      operationId: previewKnowledge
      description: The technical part of a prompt as a job would receive it, with what one entry hides from another.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: role, in: query, required: true, schema: { type: string } }
        - { name: phase, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgePreview" } } } }
  /users:
    get:
      operationId: listUsers
      description: Everyone in the workspace. Workspace admins only.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/config:
    get:
      operationId: getProjectConfig
      description: "The project's process configuration: templates per kind of task, role prompts, the autopilot switch and the backend and budget policy."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
    put:
      operationId: setProjectConfig
      description: Replace the process configuration. Refused when a template or the policy would not hold. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /workspace/process:
    get:
      operationId: getWorkspaceProcess
      description: "The process this workspace has decided for every project in it. A project's own process_config still wins; without one, this is what applies."
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
    put:
      operationId: setWorkspaceProcess
      description: Replace the workspace process. Refused when a template would not hold. Workspace admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectConfig" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/product:
    get:
      operationId: listProductContext
      description: What this project knows about its product. Never shared with other projects.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductEntry" } } } } }
    post:
      operationId: addProductEntry
      description: Write an entry. A person's entry is approved as it is written; agents propose instead.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProductEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /product/{entryId}:
    post:
      operationId: setProductEntryStatus
      description: Approve a proposal, or archive an entry that no longer holds.
      parameters: [ { name: entryId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductStatusChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntry" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /brain:
    get:
      operationId: searchBrain
      description: >
        Search the Brain: what the caller may read, by words (websearch syntax) or, without q, the newest first.
        The same rules as the MCP server's brain_search, which answers the same hits. A person's private context
        is theirs alone; a proposal from a private conversation is read only by that conversation's readers.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { $ref: "#/components/schemas/BrainScope" } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/BrainKind" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/BrainStatus" } }
        - { name: project, in: query, required: false, description: "one project and what is above it", schema: { type: string, format: uuid } }
        - { name: at, in: query, required: false, description: "what held at this moment: approved by then and not yet replaced (\"what did we know in March\")", schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BrainHit" } } } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBrainEntry
      description: >
        Write an entry. Whoever may approve in its scope (a project's members, workspace admins for the workspace,
        a person for their own context) writes it approved unless they ask to propose; anyone else who may write
        there proposes it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewBrainEntry" } } }
      responses:
        "201": { description: written, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /brain/proposals:
    get:
      operationId: listBrainProposals
      description: What waits for a person's verdict, oldest first, within what the caller may read.
      parameters:
        - { name: project, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } } } } }
  /brain/review:
    get:
      operationId: listBrainToReview
      description: >
        Approved entries no job has cited for a while (90 days by default), oldest first: the ones worth asking
        "is this still true?". Archive what no longer holds, revise what changed.
      parameters:
        - { name: project, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 3650, default: 90 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BrainEntry" } } } } }
  /brain/{brainEntryId}:
    get:
      operationId: getBrainEntry
      description: An entry with every version, its links and where it was used (packed, searched, cited by jobs).
      parameters: [ { $ref: "#/components/parameters/brainEntryId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BrainDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: reviseBrainEntry
      description: A change is a new version (supersedes the old one once approved); the old version stays.
      parameters: [ { $ref: "#/components/parameters/brainEntryId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BrainPatch" } } }
      responses:
        "200": { description: the new version, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /brain/{brainEntryId}/approve:
    post:
      operationId: approveBrainEntry
      description: Approve a proposal; it reaches prompts from now on, and the versions before it stop being true.
      parameters: [ { $ref: "#/components/parameters/brainEntryId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /brain/{brainEntryId}/reject:
    post:
      operationId: rejectBrainEntry
      description: Turn a proposal down. It stays, rejected, so the same thing is not proposed again unnoticed.
      parameters: [ { $ref: "#/components/parameters/brainEntryId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntry" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /brain/{brainEntryId}/archive:
    post:
      operationId: archiveBrainEntry
      description: Archive an entry that no longer holds; it stays readable and stops reaching prompts.
      parameters: [ { $ref: "#/components/parameters/brainEntryId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntry" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/brain/preview:
    get:
      operationId: previewBrainPackage
      description: >
        What a job of this task would be handed from the Brain if the caller asked for it (debug, like
        /projects/{id}/knowledge/preview): its component's and neighbours' entries, the product context for the
        roles that weigh direction, the project's runbooks and facts, the agent's lessons, what people share and
        the caller's own private context. Each entry's title carries its [brain:<id>] tag.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: task, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: query, required: false, schema: { type: string, description: "defaults to the current phase's role" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ContextPackage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/brain/impact:
    get:
      operationId: getBrainImpact
      description: >
        Whether the Brain helps, measured: the median context a phase job was handed and the share of phases
        sent back, in a window before a moment and one as long after it. The context should grow by at most 20%
        and rollbacks should fall.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: pivot, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BrainImpact" } } } }
  /me/brain:
    get:
      operationId: getMyBrain
      description: >
        Everything the Brain holds about the caller, every version: their expertise, preferences and focus (worked out
        from the tasks they own and talk about, never approved by anyone, never seen by anyone else), and what agents see
        of it. This is the export.
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/MyBrain" } } } }
    delete:
      operationId: forgetMyBrain
      description: Delete everything the Brain holds about the caller. Nothing of it is kept in any job's record.
      responses:
        "200": { description: forgotten, content: { application/json: { schema: { $ref: "#/components/schemas/Forgotten" } } } }
  /me/brain/focus:
    put:
      operationId: setMyFocus
      description: >
        Turn the working out of the caller's focus on or off. Forgetting (DELETE /me/brain) turns it off, and it stays
        off until the caller turns it on again.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FocusSetting" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSetting" } } } }
  /presets:
    get:
      operationId: listProjectPresets
      description: Starting points for a new project, shared by the whole workspace.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectPreset" } } } } }
    post:
      operationId: saveProjectPreset
      description: Saves a project as a preset. Workspace admins only; saving under an existing name replaces it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewProjectPreset" } } }
      responses:
        "201": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPreset" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /presets/{presetId}:
    delete:
      operationId: deleteProjectPreset
      parameters: [ { name: presetId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/components:
    get:
      operationId: listComponents
      description: The parts this project is made of, with what each depends on.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
    put:
      operationId: putComponent
      description: Adds a component or updates it by key. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComponentInput" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/components/{key}/approve:
    post:
      operationId: approveComponent
      description: Accepts a component the server proposed. Rejecting one is deleting it.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/components/{key}:
    delete:
      operationId: deleteComponent
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/campaign:
    get:
      operationId: getCampaign
      description: "How far a campaign has got: every target, what became of it, and the totals."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addCampaignTargets
      description: Gives a campaign the places it has to reach, one task per target. Adding a target it already has does nothing.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CampaignTargets" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/campaign/skip:
    post:
      operationId: skipCampaignTarget
      description: Drops one target, with a reason. Its task is closed; approving the campaign needs every target finished or skipped.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkipTarget" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/admit:
    post:
      operationId: admitTask
      description: "Lets work raised outside the workspace through: an agent may then start on it. Refused for a task raised inside."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/allow-agents:
    post:
      operationId: allowAgents
      description: "A person allowing agents to work on this task without asking for permission. Agents run as the runner machine's user, with its files, network and credentials; Gator filters their environment but cannot sandbox them. Until a person allows it, no job starts on the task, neither by the autopilot nor by hand. Saying it twice keeps the first answer. Admitting outside work does not imply it. Only a person can do it."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/context:
    get:
      operationId: previewTaskContext
      description: "What a job started now would be handed: the same package, assembled from what the project knows today. For reading before spending anything."
      parameters:
        - { $ref: "#/components/parameters/taskId" }
        - { name: role, in: query, required: false, schema: { type: string, description: "defaults to the current phase's role" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ContextPackage" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/component:
    put:
      operationId: setTaskComponent
      description: "Says which part of the product a task is about; the job's prompt then carries that part, its neighbours and its decisions. Null clears it."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskComponent" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/releases:
    get:
      operationId: listReleases
      description: What reached each environment, newest first, and whether its observation window is still open.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Release" } } } } }
  /projects/{projectId}/incidents:
    get:
      operationId: listIncidents
      description: What production said went wrong, open ones first.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } }
  /projects/{projectId}/quality:
    get:
      operationId: listQuality
      description: "The project's scorecard: each component's score, how it moved since the last sweep, and the rules behind it."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scorecard" } } } } }
    post:
      operationId: scoreNow
      description: Runs the scorecard at once instead of waiting for the daily sweep. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scorecard" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/templates:
    get:
      operationId: listProjectTemplates
      description: The project's process for each kind of task, in phase order. Phases that need a plugin capability the project lacks are listed as inactive.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectTemplate" } } } } }
  /projects/{projectId}/plugins:
    get:
      operationId: listProjectPlugins
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectPlugin" } } } } }
  /projects/{projectId}/plugins/{pluginName}:
    put:
      operationId: configureProjectPlugin
      description: Enable, disable or configure a plugin for the project. Secret settings are write-only; leaving one out keeps its value, an empty string removes it. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/pluginName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPluginSettings" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPlugin" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/automations:
    get:
      operationId: listProjectAutomations
      description: >-
        The automations Gator ships, each with this project's state: whether it is on, its
        settings, whether the project has what it needs, and its last run. A fixed catalogue;
        every one is off until a project admin switches it on. Anyone who can read the project.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Automation" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/automations/{automationKey}:
    put:
      operationId: setProjectAutomation
      description: >-
        Switches an automation on or off, or changes its settings. Switching on one that puts
        agents to work (usesAgents) is the person allowing agents to work without asking on every
        task it creates, and needs allowAgents true: 409 consent_required otherwise. Those tasks are
        created with agentsAllowedBy set to that person and, when their words come from outside
        the workspace, admitted by them too. 409 automation_unavailable while the project lacks
        what it needs (see unavailableReason). Changing the settings of one already on needs no
        allowAgents and keeps who switched it on. Switching off stops new tasks; tasks already made
        keep their consent. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/automationKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomationChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/plugins/{pluginName}/connect:
    post:
      operationId: connectProjectPlugin
      description: >-
        Starts "Connect GitHub" and the like: answers the provider's sign-in page for the person's
        browser. The provider sends the browser back to the server's /connect/callback, which stores
        the token as the plugin's secret for this project and then goes on to returnTo, if given
        (gator://… or a loopback address), with plugin, project and status=connected or error.
        Connecting does not switch the plugin on. 409 when this server has no OAuth app for it.
        Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/pluginName" } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PluginConnectRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/PluginConnectStart" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/plugins/{pluginName}/import:
    post:
      operationId: importProjectPlugin
      description: Brings in what the outside system already holds, such as open issues, as tasks. Safe to repeat; switching a tracker on does it once by itself. 409 while the plugin is not running. Project admins only.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/pluginName" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/PluginImport" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/plugins/{pluginName}/calls:
    get:
      operationId: listPluginCalls
      description: Recent calls between the core and the plugin for this project, secrets redacted. Project admins only.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { $ref: "#/components/parameters/pluginName" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PluginCall" } } } } }
  /tasks/{taskId}/plugin-ui:
    get:
      operationId: getTaskPluginUI
      description: Markdown tabs and chips the project's plugins contribute to a task.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/PluginUI" } } } }
  /inbox:
    get:
      operationId: listInbox
      description: Decisions waiting for a human, most urgent first.
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          required: false
          description: only tasks handed to the caller
          schema: { type: boolean }
        - name: all
          in: query
          required: false
          description: >-
            Every decision, not only the tasks: components and product entries an agent proposed,
            runners waiting for a backend login, plugins switched off after failing, and stalled
            jobs. Without it the answer holds only task decisions with the original seven
            reasons, which is what clients built before these existed can read.
          schema: { type: boolean }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Decision" } } } } }
  /dashboard:
    get:
      operationId: getDashboard
      description: >-
        The numbers on the app's home screen that come from plugins: open issues each tracker
        brought in (its tasks Gator still holds open) and open errors each monitoring plugin
        reported (incidents not yet closed). One entry per plugin switched on in a project the
        caller can read, zero included, so a client can tell "no errors" from "nothing watches".
      parameters:
        - name: projectId
          in: query
          required: false
          description: only this project
          schema: { type: string, format: uuid }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardCounts" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}:
    get:
      operationId: getTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTask
      description: >-
        Changes what a person said about an open task. Title, description and urgency may change
        while it is open; kind only before any work happened on it, and the task then starts over
        in the first phase of the new kind's process. Every change goes into the task's
        transitions as kind "edit". Emits task.updated.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskPatch" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/close:
    post:
      operationId: closeTask
      description: >-
        Closes a task wherever it stands, with a reason; its history stays. Jobs still queued or
        running on it are stopped. Closing a closed task changes nothing. Emits task.closed.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskStateChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/reopen:
    post:
      operationId: reopenTask
      description: >-
        Brings a closed task back in the phase it was closed in, with a reason. The phase is
        entered afresh, so its earlier approval no longer counts. Reopening an open task changes
        nothing. Emits task.reopened.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskStateChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/approve:
    post:
      operationId: approveTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/advance:
    post:
      operationId: advanceTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/rollback:
    post:
      operationId: rollbackTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Rollback" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/handoff:
    post:
      operationId: handoffTask
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/checks:
    put:
      operationId: setTaskCheck
      description: Record an automated verdict on the current gate. Used by plugins.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Check" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/usage:
    post:
      operationId: recordTaskUsage
      description: >
        Record tokens, cost and agent time for work done on a task. Runners send one record per
        job; plugins and people may report too. Repeating an idempotencyKey for the same task is a no-op.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UsageInput" } } }
      responses:
        "201": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/UsageAck" } } } }
        "200": { description: "duplicate idempotencyKey, nothing recorded", content: { application/json: { schema: { $ref: "#/components/schemas/UsageAck" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/metrics:
    get:
      operationId: getTaskMetrics
      description: Time and token accounting for one task, total and per phase.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TaskMetrics" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/budget:
    get:
      operationId: getProjectBudget
      description: "The daily limit and what has been spent against it since the start of the current UTC day — the same numbers the budget gate check uses."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
  /projects/{projectId}/metrics:
    get:
      operationId: getProjectMetrics
      description: Aggregates per task kind for tasks created since the given time (default 30 days).
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMetrics" } } } }
  /agent/task:
    get:
      operationId: agentTask
      description: "What this job is about: its task, phase, gate and the documents its phases produced. For a job's own identity; a person reads the same thing through /tasks."
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentTask" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /agent/blocked:
    post:
      operationId: agentBlocked
      description: "The agent cannot go on: the task is blocked with this reason and a person is asked. Better than burning the job guessing."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentReason" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/question:
    post:
      operationId: agentQuestion
      description: "Asks the person a question and stops the phase until it is answered. The question blocks the gate, so it reaches the inbox like any other decision."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentReason" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/artifacts:
    post:
      operationId: agentPutArtifact
      description: Records a document for the job's phase — a brief, a plan, a review — without waiting for the job to end.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentArtifact" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/product:
    post:
      operationId: agentProposeProduct
      description: "Proposes a decision or a lesson for the product context. Always proposed, never approved: a person decides what the product knows about itself."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentProduct" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/say:
    post:
      operationId: agentSay
      description: "Says something in the conversation the job's turn answers in (a phase job: its task's thread), as the job's agent and beside its answer. An @handle of another agent there asks it: a delegation in the same chain, under its limits."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSay" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/thread:
    get:
      operationId: agentThread
      description: "The conversation the job speaks in, its latest messages, oldest first, as the prompt carries them (words from outside the workspace marked untrusted): more of it than the prompt had room for."
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentThread" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /agent/tasks:
    post:
      operationId: agentProposeTask
      description: "Proposes a task in the conversation the job speaks in, as a card. Nothing is created until a person accepts it (POST /proposals/{messageId}/accept)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentTaskProposal" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentWrite" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/catalogue:
    get:
      operationId: agentCatalogue
      description: The parts this project is made of, as the catalogue records them.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /agent/knowledge:
    get:
      operationId: agentKnowledge
      description: "Searches the project's knowledge and product context for words the job's own package did not carry."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentDocument" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/artifacts:
    get:
      operationId: listTaskArtifacts
      description: Documents the task's phases produced (brief, plan, report, review), every version.
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
  /tasks/{taskId}/jobs:
    get:
      operationId: listTaskJobs
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Job" } } } } }
    post:
      operationId: createTaskJob
      description: "Queue an agent job for the task's current phase. Role defaults to the phase's runner role. placement says where it runs: local (a machine of the caller's, or a shared one; the default) or cloud (a cloud runner, started on demand when the server has a provisioner). A task nobody has allowed agents on answers 409 with code agents_not_allowed, unless allowAgents is true, which records the caller's consent first (only a person can give it)."
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewJob" } } }
      responses:
        "201": { description: queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      description: Stored agent output after the given sequence number. Live output streams on the WebSocket topic job:<id>.
      parameters:
        - { $ref: "#/components/parameters/jobId" }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JobEvent" } } } } }
  /jobs/{jobId}/context:
    get:
      operationId: listJobContext
      description: "The package of documents this job was handed, in the order the prompt carried them, including what was cut short or left out and why."
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ContextPackage" } } } }
  /jobs/{jobId}/agent-calls:
    get:
      operationId: listAgentCalls
      description: What the agent said back to Gator while this job ran — blocked, asked, recorded, proposed — in the order it said it.
      parameters:
        - { $ref: "#/components/parameters/jobId" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentCall" } } } } }
  /jobs/{jobId}/stop:
    post:
      operationId: stopJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/StopJob" } } }
      responses:
        "202": { description: stop requested or done, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/steer:
    post:
      operationId: steerJob
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SteerJob" } } }
      responses:
        "202": { description: delivered to the runner }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/checkpoints:
    get:
      operationId: listJobCheckpoints
      description: |
        What each turn of the job changed, turn by turn: the runner checkpoints the worktree after
        every turn of a work job (a commit on a hidden ref, never pushed; the agent's branch and index
        are left alone) and sends the turn's files with their line counts. A chat job, a job without a
        repository, a v3 runner and a project with process_config.checkpoints.enabled=false have none.
        For whoever may read the job.
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/diff:
    get:
      operationId: getJobDiff
      description: |
        The job's diff over its turns from..to (seq numbers, both included; default the first and the
        last), as a unified diff ("this turn / the whole job" in the diff view). From the first turn
        it is exactly the worktree as the job found it against turn `to`. From a later turn it is the
        turns' own diffs put together file by file, each file's parts one after another: the server
        keeps diffs, not the repository. Every diff is redacted like logs before it is kept and cut at
        1 MiB (Checkpoint.truncated).
      parameters:
        - { $ref: "#/components/parameters/jobId" }
        - { name: from, in: query, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, schema: { type: integer, minimum: 1 } }
        - { name: repo, in: query, schema: { type: string }, description: "the repository, for a project with more than one; default the job's first" }
        - { name: ignoreWhitespace, in: query, schema: { type: boolean }, description: "leave out changes that only change whitespace" }
      responses:
        "200": { description: a unified diff, content: { text/x-diff: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /checkpoints/{checkpointId}/diff:
    get:
      operationId: getCheckpointDiff
      description: |
        One turn's diff against the turn before (the first turn's against the worktree as the job
        found it), or with whole=true the job's diff up to this turn. For whoever may read its job.
      parameters:
        - { $ref: "#/components/parameters/checkpointId" }
        - { name: whole, in: query, schema: { type: boolean } }
        - { name: ignoreWhitespace, in: query, schema: { type: boolean } }
      responses:
        "200": { description: a unified diff, content: { text/x-diff: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }
  /checkpoints/{checkpointId}/comments:
    post:
      operationId: createReviewComment
      description: |
        A draft comment on lines of the checkpoint's diff (its turn's, or the job's up to it): a path,
        a side (new numbers the file after the change, old before) and a range of lines the diff
        shows; the server keeps the code there with it (snippet). It stays the author's draft until
        they send their drafts. A member of the job's project who may read the job.
      parameters: [ { $ref: "#/components/parameters/checkpointId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewReviewComment" } } }
      responses:
        "201": { description: kept as a draft, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewComment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/comments:
    get:
      operationId: listJobReviewComments
      description: The job's comments to lay over its diff, turn by turn — every comment sent, and the caller's own drafts.
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReviewComment" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/comments/send:
    post:
      operationId: sendReviewComments
      description: |
        "Send the notes to @worker": the caller's drafts on the job become one message, by the
        caller, mentioning the agent (the job's own unless agentId says another), where the job's
        agent answered (its turn's conversation, else the task's thread). The mention asks the agent
        as any mention does — a work agent on a task nobody allowed agents on answers in chat and a
        consent card asks. The comments go as structure, not as text to parse: the agent reads each
        (file, lines, the code there, the note) in the package of its turn, under "Notes on your
        changes". 400 when the caller has no drafts on the job.
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/SendReviewComments" } } }
      responses:
        "201": { description: sent, content: { application/json: { schema: { $ref: "#/components/schemas/SentReviewComments" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /review-comments/{commentId}:
    patch:
      operationId: updateReviewComment
      description: What a draft says (its author only), or whether a comment is resolved (anyone who may comment on the job).
      parameters: [ { $ref: "#/components/parameters/commentId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewCommentChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewComment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReviewComment
      description: Take back one of the caller's drafts; a comment that was sent stays (resolve it instead).
      parameters: [ { $ref: "#/components/parameters/commentId" } ]
      responses:
        "204": { description: taken back }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /runtime-requests:
    get:
      operationId: listWaitingRuntimeRequests
      description: |
        What agents wait for the caller to decide, newest first ("Needs you"): tool approvals and
        questions of turns in conversations where the caller, a member of the project, may write.
        A request leaves the list when someone decides it (from any device: runtime_request.decided
        reaches the job's and the inbox's WebSocket topics), when it expires, or when its turn ends.
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RuntimeRequest" } } } } }
  /runtime-requests/{requestId}:
    get:
      operationId: getRuntimeRequest
      description: One request, for whoever may read where its agent works.
      parameters: [ { $ref: "#/components/parameters/requestId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeRequest" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /runtime-requests/{requestId}/decide:
    post:
      operationId: decideRuntimeRequest
      description: |
        The tool_approval card's buttons: allow, allow until the session ends (the same rule is let
        through from then on), deny (feedback is the reason the agent reads) or stop (deny and stop
        the turn). A question is answered with allow and the answer as feedback. A member of the
        job's project who may write where the agent works (its turn's conversation, else the task's
        thread), like Allow on a consent card; nobody from outside the workspace. The request is
        decided once: 409 when it is no longer waiting (decided, expired, its turn ended). Text a
        member writes in the conversation while the agent waits is a denial with that text as the
        reason, and steers the agent too.
      parameters: [ { $ref: "#/components/parameters/requestId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeDecision" } } }
      responses:
        "200": { description: decided, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/runtime-requests:
    get:
      operationId: listJobRuntimeRequests
      description: Everything the job's agent asked a person, oldest first, for whoever may read the job.
      parameters: [ { $ref: "#/components/parameters/jobId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RuntimeRequest" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /runners:
    get:
      operationId: listRunners
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunnerInfo" } } } } }
  /runners/{runnerId}:
    get:
      operationId: getRunner
      description: |
        One runner, with what each of its backends can do in a live session
        (capabilities.perBackend): a client hides Steer, a native Stop and approval cards for a job
        whose backend cannot carry them out.
      parameters: [ { $ref: "#/components/parameters/runnerId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerInfo" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: forgetRunner
      description: |
        Forget a runner: its token stops authenticating and it leaves the list. The row stays,
        because every job it ran points at it and the record of which machine did the work is
        worth more than a tidy table. A connected runner is refused: disconnect it first, or it
        reappears on its next heartbeat. Requires workspace admin.
      parameters: [ { $ref: "#/components/parameters/runnerId" } ]
      responses:
        "204": { description: forgotten }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /runners/{runnerId}/login:
    post:
      operationId: requestRunnerLogin
      description: |
        Ask a connected runner to start a backend login; the URL and code arrive on the WebSocket
        topic runner:<id>. Refused with 409 unless the runner declared capabilities.canLogin — no
        runner does today, so a backend is signed in on the machine itself, as the user the runner
        runs as.
      parameters: [ { $ref: "#/components/parameters/runnerId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "202": { description: requested }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/conversation:
    get:
      operationId: getTaskConversation
      description: >-
        The task's thread: the replies under its card in the project's task channel (#general, or
        process_config.conversations.task_channel). Every task has one; a task made before
        conversations, or one whose thread is being opened right now, gets it on this call when the
        caller may write in the project (404 for anyone else until it is there). 404
        when the thread hangs under a message the caller may not read (a private channel).
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}/transitions:
    get:
      operationId: listTaskTransitions
      parameters: [ { $ref: "#/components/parameters/taskId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transition" } } } } }
  /projects/{projectId}/conversations:
    get:
      operationId: listProjectConversations
      description: >-
        A project's conversations of one kind that the caller may read: the channels open to the
        project and those the caller is in, with the caller's unread counts. Unread counts are
        kept for conversations the caller is in (joined); reading or posting joins one.
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [channel, dm, thread, task], default: channel } }
        - { name: archived, in: query, required: false, description: include archived channels, schema: { type: boolean } }
        - { name: q, in: query, required: false, description: "channels whose name contains this", schema: { type: string } }
        - { $ref: "#/components/parameters/listLimit" }
        - { $ref: "#/components/parameters/listOffset" }
      responses:
        "200": { $ref: "#/components/responses/ConversationList" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createChannel
      description: Opens a channel in the project; its creator owns it. People who may write in the project only (not viewers). 409 when the name is taken.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewChannel" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /conversations:
    get:
      operationId: listMyConversations
      description: Every conversation the caller is in and may still read, newest activity first, with unread counts; DMs outside any project are listed here.
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [channel, dm, thread, task] } }
        - { $ref: "#/components/parameters/listLimit" }
        - { $ref: "#/components/parameters/listOffset" }
      responses:
        "200": { $ref: "#/components/responses/ConversationList" }
        "400": { $ref: "#/components/responses/Error" }
  /conversations/dm:
    post:
      operationId: openDirectMessage
      description: >-
        The DM between the caller and these people (2–8 people, the caller included), opened when
        they have none: the same people in the same scope always get the same DM (200), a new one
        answers 201. With projectId, everyone must be in that project; without it, the DM is outside
        every project and anyone in the workspace may be in it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewDirectMessage" } } }
      responses:
        "200": { description: the DM they already had, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "201": { description: opened, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      description: A conversation with its members and what the caller may do in it. 404 for one the caller may not read, whether or not it exists.
      parameters: [ { $ref: "#/components/parameters/conversationId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateConversation
      description: >-
        Changes the topic (anyone who may write), or renames or archives a channel (project admins
        and the channel's owners). #general keeps its name and is never archived (409).
      parameters: [ { $ref: "#/components/parameters/conversationId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConversationPatch" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /conversations/{conversationId}/members/{memberKind}/{memberId}:
    put:
      operationId: setConversationMember
      description: >-
        Joins a conversation (oneself, anyone who may read it), adds someone else (anyone who may
        write; that person must be able to read it), or changes a membership: notify is one's own,
        role a moderator's. A DM keeps the people it was opened with (409). Agents join from phase 2.
      parameters:
        - { $ref: "#/components/parameters/conversationId" }
        - { $ref: "#/components/parameters/memberKind" }
        - { $ref: "#/components/parameters/memberId" }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ConversationMemberChange" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationMember" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeConversationMember
      description: Leaves a conversation, or (moderators) takes someone out of it. Nobody leaves a DM (409).
      parameters:
        - { $ref: "#/components/parameters/conversationId" }
        - { $ref: "#/components/parameters/memberKind" }
        - { $ref: "#/components/parameters/memberId" }
      responses:
        "204": { description: removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      description: >-
        One page of messages in seq order. Without beforeSeq or afterSeq, the newest page; with
        beforeSeq, the page just older than it; with afterSeq, the messages after it (what a client
        reads after message.posted). hasMore says there is more in the direction asked.
      parameters:
        - { $ref: "#/components/parameters/conversationId" }
        - { name: beforeSeq, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: afterSeq, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/MessagePage" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: postMessage
      description: >-
        Posts a message. Its seq is the next in the conversation, without gaps. A clientId the caller
        already posted in this conversation answers that message with 200 and writes nothing. Mentioned
        people who cannot read the conversation are left out. Posting joins the conversation.
        Emits message.posted (and message.replied on the root's conversation for a reply).
      parameters: [ { $ref: "#/components/parameters/conversationId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewMessage" } } }
      responses:
        "200": { description: already posted with this clientId, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "201": { description: posted, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      description: Moves the caller's read marker up to seq (never back, never past the newest message); reading joins the conversation. Emits conversation.read to the caller alone.
      parameters: [ { $ref: "#/components/parameters/conversationId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReadMarker" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationMember" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /messages/{messageId}:
    get:
      operationId: getMessage
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editMessage
      description: Changes the words of one's own message, within 24 hours of posting it. Cards are not edited by hand (409). Emits message.edited.
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MessagePatch" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMessage
      description: >-
        Takes a message's words (and files) away, keeping its place in the conversation: its author
        may, and so may the conversation's moderators (project admins, a channel's owners). Deleting
        again changes nothing. Emits message.deleted.
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /messages/{messageId}/reactions/{emoji}:
    put:
      operationId: addReaction
      description: Adds the caller's emoji (a Unicode emoji or a :shortcode:, URL-encoded). Viewers react too. Emits reaction.changed when something changed.
      parameters: [ { $ref: "#/components/parameters/messageId" }, { $ref: "#/components/parameters/emoji" } ]
      responses:
        "204": { description: added }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeReaction
      parameters: [ { $ref: "#/components/parameters/messageId" }, { $ref: "#/components/parameters/emoji" } ]
      responses:
        "204": { description: removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /search/messages:
    get:
      operationId: searchMessages
      description: >-
        Messages whose words match q (web-search syntax: words, "quoted phrases", -excluded), best
        first, only from conversations the caller may read. projectId narrows it to one project.
        Deleted messages are not found.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MessageHit" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /attachments:
    post:
      operationId: uploadAttachment
      description: >-
        Uploads one file (up to 25 MB) into a conversation the caller may write in, as
        multipart/form-data with conversationId and file. The file belongs to no message until the
        uploader posts one with its id in attachments. 503 when the server keeps no files
        (GATOR_ATTACHMENTS_DIR or GATOR_ATTACHMENTS_S3_*).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [conversationId, file]
              properties:
                conversationId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "201": { description: uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Attachment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      description: The file's bytes, for whoever may read the conversation it was sent in (before it is sent, its uploader alone). Images show inline; anything else downloads.
      parameters: [ { $ref: "#/components/parameters/attachmentId" } ]
      responses:
        "200": { description: the file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /messages/{messageId}/promote:
    post:
      operationId: promoteMessage
      description: >-
        "Make this a task." Creates a task from the message, through the same door as any other
        task: the thread under the message (or the thread the message is a reply in) becomes the
        task's thread, and the task's description quotes the message and its first replies with a
        link back to the conversation. The title defaults to the message's first line. projectId
        is needed only for a DM outside every project. 409 when the thread already is a task's.
        People who may write where the message is and in the project.
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PromoteMessage" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/PromotedMessage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /messages/{messageId}/thread:
    get:
      operationId: getMessageThread
      description: >-
        The thread under a message, opened the first time somebody who may write there asks (with
        the message's author in it); to anyone else, a thread not opened yet is 404. The thread under a task's card is the task's conversation. Replies have no threads
        of their own (400).
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /turns/{turnId}:
    get:
      operationId: getTurn
      description: "One turn of an agent: what asked it, where it answers, the chain it is part of, its job and what it cost. For anyone who may read the conversation it answers in."
      parameters: [ { $ref: "#/components/parameters/turnId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentTurn" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /turns/{turnId}/stop:
    post:
      operationId: stopTurn
      description: "Stop an answer being written (the button under a streaming message): its job is stopped and the message ends with what it had said. For anyone who may write in the conversation."
      parameters: [ { $ref: "#/components/parameters/turnId" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } }
      responses:
        "202": { description: "stop requested, or done for a turn with no job yet", content: { application/json: { schema: { $ref: "#/components/schemas/AgentTurn" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proposals/{messageId}/accept:
    post:
      operationId: acceptTaskProposal
      description: "Makes the task an agent proposed (a task_proposal card), as the caller: a member of the project who may write where it was proposed. The card then points at the task."
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "201": { description: the task, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /turns/{turnId}/allow:
    post:
      operationId: allowTurnToWork
      description: "The consent card's button (\"Let @worker work on this?\"): a work agent that answered in chat because nobody allowed agents on the task. The caller (a project member who may write in the conversation) allows agents on the task, as POST /tasks/{id}/allow-agents does, and the agent takes a work turn on the same question. Repeating it answers the same turn."
      parameters: [ { $ref: "#/components/parameters/turnId" } ]
      responses:
        "201": { description: the work turn, content: { application/json: { schema: { $ref: "#/components/schemas/AgentTurn" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/agents:
    get:
      operationId: listProjectAgents
      description: "The agents people of this project can mention, for @autocomplete: its own (the defaults of every project and those it made) and the workspace's. For anyone who may read the project."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Agent" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProjectAgent
      description: "A project's own agent, such as a @backend-reviewer for the reviewer role. For the project's admins. Its handle must not be taken in the project or the workspace."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewAgent" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspace/agents:
    get:
      operationId: listWorkspaceAgents
      description: The workspace's own agents, which every project sees.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Agent" } } } } }
    post:
      operationId: createWorkspaceAgent
      description: "An agent every project sees. For workspace admins. Its handle must not be taken in any project."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewAgent" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agents/{agentId}:
    get:
      operationId: getAgent
      description: "An agent's profile: who it is, what it may do, and its record over the last 30 days."
      parameters: [ { $ref: "#/components/parameters/agentId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAgent
      description: "Change an agent or pause it (status: paused). For its project's admins, or workspace admins for a workspace agent. A built-in agent keeps its handle and role."
      parameters: [ { $ref: "#/components/parameters/agentId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentPatch" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      description: "Remove an agent a person made. A built-in agent is paused instead (409)."
      parameters: [ { $ref: "#/components/parameters/agentId" } ]
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agents/{agentId}/turns:
    get:
      operationId: listAgentTurns
      description: "An agent's turns since a moment (default 30 days), newest first: those in conversations the caller may read."
      parameters:
        - { $ref: "#/components/parameters/agentId" }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentTurn" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /registries:
    get:
      operationId: listRegistries
      description: "Where the marketplace comes from: Gator's own registry (GATOR_MARKETPLACE_URL) first, then the company's. Anyone signed in."
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Registry" } } } } }
    post:
      operationId: addRegistry
      description: "Add a company's own registry: a git repository (or a directory on the server) with index.json and, when it has a key, index.json.sig. Workspace admins only."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewRegistry" } } }
      responses:
        "201": { description: added, content: { application/json: { schema: { $ref: "#/components/schemas/Registry" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /registries/{registryId}:
    delete:
      operationId: deleteRegistry
      description: "Remove a registry nothing is installed from. Gator's own stays (409). Workspace admins only."
      parameters: [ { $ref: "#/components/parameters/registryId" } ]
      responses:
        "204": { description: removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /registries/{registryId}/fetch:
    post:
      operationId: fetchRegistry
      description: >
        Fetch a registry and cache every package that verifies: the index's signature (when the registry has a key) first,
        then each package's files against its checksum and the server's limits. A bad signature takes nothing (400); a
        package that fails, or a version already published with other files, is turned away on its own and listed under
        rejected. Nothing installed changes. Workspace admins only.
      parameters: [ { $ref: "#/components/parameters/registryId" } ]
      responses:
        "200": { description: fetched, content: { application/json: { schema: { $ref: "#/components/schemas/RegistryFetch" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /marketplace:
    get:
      operationId: listMarketplace
      description: "The catalogue of every registry, each package at its newest version. With projectId, what that project has installed of each (and whether an update waits) and what it lacks to run it."
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [agent, skill, integration, process, knowledge] } }
        - { name: q, in: query, required: false, description: "words in the name, display name or description", schema: { type: string } }
        - { name: phase, in: query, required: false, description: "a phase of the life of software: idea, discovery, planning, implementation, verification, release, monitoring", schema: { type: string } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketplaceItem" } } } } }
  /marketplace/{kind}/{name}:
    get:
      operationId: getMarketplacePackage
      description: "One package: its manifest (README, example prompt, permissions, requirements), every version offered and its files."
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [agent, skill, integration, process, knowledge] } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: registryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: false, description: "default: the newest", schema: { type: string } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/installations:
    get:
      operationId: listProjectInstallations
      description: "What the project installed from the marketplace, with the version, the permissions accepted and whether an update waits."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Installation" } } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: installIntoProject
      description: >
        Install a package into the project, for its admins. acceptedPermissions must hold every permission the
        package's version asks for (its manifest's permissions, line for line); otherwise nothing is installed and 409
        names what is still to accept. An agent's handle is the package's suggestion unless handle says another; one
        taken where people would see it is 409 too. An installed agent is in the project's agents (and @autocomplete)
        at once.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewInstallation" } } }
      responses:
        "201": { description: installed, content: { application/json: { schema: { $ref: "#/components/schemas/Installation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "permissions not accepted, or already installed, or the handle is taken", content: { application/json: { schema: { $ref: "#/components/schemas/InstallRefusal" } } } }
  /installations/{installationId}/update:
    get:
      operationId: previewInstallationUpdate
      description: "What updating would do, changing nothing: the permissions the version adds and drops, and what a person changed here that it would touch, as diffs. The \"Update\" chip's sheet."
      parameters:
        - { $ref: "#/components/parameters/installationId" }
        - { name: version, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePreview" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /workspace/installations:
    get:
      operationId: listWorkspaceInstallations
      description: "What the workspace installed for every project: workspace agents, skills, native plugins."
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Installation" } } } } }
    post:
      operationId: installIntoWorkspace
      description: "Install a package for the whole workspace (an agent every project sees, a skill, a native plugin, a process for every project). Workspace admins only; the same acceptance as a project's."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewInstallation" } } }
      responses:
        "201": { description: installed, content: { application/json: { schema: { $ref: "#/components/schemas/Installation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "permissions not accepted, or already installed", content: { application/json: { schema: { $ref: "#/components/schemas/InstallRefusal" } } } }
  /installations/{installationId}:
    get:
      operationId: getInstallation
      parameters: [ { $ref: "#/components/parameters/installationId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Installation" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInstallation
      description: >
        Bring an installation to another version (default: the newest its registry offers). Nothing ever updates by
        itself. A version that asks for permissions never accepted needs them in acceptedPermissions (409
        permissions_not_accepted otherwise, naming them). A part a person changed since installing (an agent's
        instructions, a skill's SKILL.md, a process's template) blocks the update (409 local_changes, with diffs)
        until resolve says keep_local (the new version, their changes kept) or take_theirs (the new version whole).
        An agent keeps its handle; a remote server its allowlist and, at the same address, its credentials. For the
        project's admins, or workspace admins.
      parameters: [ { $ref: "#/components/parameters/installationId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstallationUpdate" } } }
      responses:
        "200": { description: updated, content: { application/json: { schema: { $ref: "#/components/schemas/Installation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "permissions not accepted, local changes, or that version is installed already", content: { application/json: { schema: { $ref: "#/components/schemas/InstallRefusal" } } } }
    delete:
      operationId: removeInstallation
      description: "Uninstall: an agent is put away (its turns stay), a skill, an MCP server or a process goes. For the project's admins, or workspace admins."
      parameters: [ { $ref: "#/components/parameters/installationId" } ]
      responses:
        "204": { description: removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/skills:
    get:
      operationId: listProjectSkills
      description: "The skills the project's agents may carry: the project's own and the workspace's (an agent carries a skill by naming it in skills)."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SkillInfo" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/remote-agents:
    post:
      operationId: createRemoteAgent
      description: >
        Add an agent outside Gator to the project, through A2A: its Agent Card is fetched (https, no private
        address unless the server allows them) and checked, and the credential its endpoint takes (HTTP bearer) is
        kept encrypted and never shown again. The agent is a member like any other — mention it and the turn is an A2A
        task sent to the card's endpoint — but it chats and plays no role, answers only in conversations open to the
        whole project, and its answers reach other agents as untrusted. For the project's admins.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewRemoteAgent" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/a2a-clients:
    get:
      operationId: listA2AClients
      description: "The outside agents let in to call the project's exposed agents, with what each spent today. For the project's admins."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/A2AClient" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createA2AClient
      description: >
        Let an outside agent in: a token (gtr_a2a_…, shown once) that reaches only /a2a/<project>/<agent> of the agents
        this project exposes, a daily budget (default $5; the cost of the turns it asked for, jobs still running at
        their cap) and a rate (default 30 requests a minute). What it asks is a message in #a2a-<name>, as an outside
        identity: agents answer it in chat. For the project's admins.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewA2AClient" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/A2AClientCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /a2a-clients/{clientId}:
    delete:
      operationId: revokeA2AClient
      description: "Take a client's token away; what it asked stays in its channel. For the project's admins."
      parameters: [ { name: clientId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/A2AClient" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agents/{agentId}/a2a:
    put:
      operationId: setAgentA2A
      description: >
        Show a project's own agent to its A2A clients, or stop (nobody is shown by default). An exposed agent has an
        Agent Card at cardUrl that anyone may read, and answers the project's clients at url. For the project's admins.
      parameters: [ { $ref: "#/components/parameters/agentId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentA2A" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentA2AState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /a2a/{projectSlug}/{handle}/.well-known/agent-card.json:
    servers: [ { url: / } ]
    get:
      operationId: getA2AAgentCard
      security: []
      description: "The Agent Card (A2A 0.3) of an agent the project exposes: name, description, one skill, the JSON-RPC url and HTTP bearer authentication. 404 for any other."
      parameters:
        - { name: projectSlug, in: path, required: true, schema: { type: string } }
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/A2AAgentCard" } } } }
        "404": { description: no such exposed agent }
  /a2a/{projectSlug}/{handle}:
    servers: [ { url: / } ]
    post:
      operationId: callA2AAgent
      description: >
        A2A JSON-RPC 2.0 for the project's clients (Authorization: Bearer gtr_a2a_…; any other token is 401 here, and
        an A2A token is 403 anywhere else). message/send posts the text parts as the client's message in
        #a2a-<client>, asking the agent, and answers the task (submitted, working, completed with the answer as status
        message and artifact, failed, rejected, canceled); with configuration.blocking it waits up to 25 s.
        messageId makes it idempotent. tasks/get reads a task the client was given; metadata carries turnId and
        costUsd. tasks/cancel is -32002 (a person stops a turn in Gator); message/stream and tasks/resubscribe are
        -32004. A spent daily budget is -32010, the rate -32011, an agent that is not exposed or not the client's
        project's -32602. Errors are JSON-RPC errors with HTTP 200.
      parameters:
        - { name: projectSlug, in: path, required: true, schema: { type: string } }
        - { name: handle, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcRequest" } } }
      responses:
        "200": { description: a JSON-RPC response, content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcResponse" } } } }
        "401": { description: no A2A client token }
  /projects/{projectId}/external-links:
    post:
      operationId: createExternalLinkCode
      description: >
        Make a code that links an account on a bridge to the caller, in this project: a messaging plugin switched on in
        the project whose manifest says it takes codes (slack does; github does not, 400).
        The person types it where the bridge hears it ("/gator link GTR-…" in Slack); it works once, for ten minutes,
        and is shown only here. Until linked, what that account says is an outside identity's: agents hear it in chat
        and it approves nothing. An email address never links an account. At most ten codes an hour.
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewExternalLink" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/ExternalLinkCode" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/external-identities:
    get:
      operationId: listExternalIdentities
      description: "The outside accounts the project's bridges have heard from, and the people they are linked to. For the project's members and viewers."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExternalIdentity" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /external-identities/{identityId}/link:
    delete:
      operationId: unlinkExternalIdentity
      description: "Take a link away: the person it links to may, and a project admin. The account speaks as an outside identity again."
      parameters: [ { name: identityId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ExternalIdentity" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/mcp-servers:
    get:
      operationId: listProjectMcpServers
      description: "The remote MCP servers the project's agents may be given: its own, and the workspace's it does not shadow. Never a secret, only which are set."
      parameters: [ { $ref: "#/components/parameters/projectId" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/McpServer" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/mcp-servers/{serverName}:
    get:
      operationId: getProjectMcpServer
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/serverName" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/McpServer" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putProjectMcpServer
      description: >
        Change the project's own server, or make one (url and auth then required; bearer or none — OAuth comes with its
        package): its address, the tools agents may call, whether it is on, and its credentials (secrets: {token: …};
        an empty value removes one). A new address drops the old one's credentials. For the project's admins.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/serverName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/McpServerSettings" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/McpServer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/mcp-servers/{serverName}/tools:
    get:
      operationId: listProjectMcpServerTools
      description: "Ask the server, with its credentials, which tools it has: which agents may call, which it marks read-only (the only ones chat agents get). For the project's admins."
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/serverName" } ]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/McpTool" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/mcp-servers/{serverName}/calls:
    get:
      operationId: listProjectMcpServerCalls
      description: "Every call the project's jobs made through the proxy to this server (the project's own, or the workspace's it reaches), newest first: method, tool, arguments (secrets masked by name and by shape), outcome, time. For the project's admins."
      parameters:
        - { $ref: "#/components/parameters/projectId" }
        - { $ref: "#/components/parameters/serverName" }
        - { $ref: "#/components/parameters/listLimit" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/McpCall" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/mcp-servers/{serverName}/connect:
    post:
      operationId: connectProjectMcpServer
      description: >
        Start connecting a server that signs in with OAuth, as the MCP authorization spec says: Gator reads the
        server's protected resource metadata (RFC 9728) and its authorization server's metadata (RFC 8414) —
        which must be the authorization server its package declared — registers a client of its own there
        (RFC 7591, kept encrypted with the server) and answers the sign-in address, with PKCE, for the person's
        browser. A provider app of this server (GATOR_<PROVIDER>_CLIENT_ID) is used instead only at the hosts
        its operator listed (GATOR_<PROVIDER>_OAUTH_HOSTS). The browser comes back to /connect/callback; the
        token stays on the server, renewed before it expires. Needs GATOR_PUBLIC_URL. For the project's admins.
      parameters: [ { $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/serverName" } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PluginConnectRequest" } } }
      responses:
        "200": { description: started, content: { application/json: { schema: { $ref: "#/components/schemas/PluginConnectStart" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspace/mcp-servers:
    get:
      operationId: listWorkspaceMcpServers
      description: "The workspace's own remote MCP servers, which every project's agents may be given."
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/McpServer" } } } } }
  /workspace/mcp-servers/{serverName}/calls:
    get:
      operationId: listWorkspaceMcpServerCalls
      description: "Every call any project's jobs made through the proxy to this workspace server, newest first. Workspace admins only."
      parameters:
        - { $ref: "#/components/parameters/serverName" }
        - { $ref: "#/components/parameters/listLimit" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/McpCall" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /workspace/mcp-servers/{serverName}:
    put:
      operationId: putWorkspaceMcpServer
      description: "Change (or make) a workspace server, as a project's. Workspace admins only."
      parameters: [ { $ref: "#/components/parameters/serverName" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/McpServerSettings" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/McpServer" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  parameters:
    serverName: { name: serverName, in: path, required: true, schema: { type: string } }
    installationId: { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    registryId: { name: registryId, in: path, required: true, schema: { type: string, format: uuid } }
    projectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    taskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    jobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    checkpointId: { name: checkpointId, in: path, required: true, schema: { type: string, format: uuid } }
    commentId: { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    turnId: { name: turnId, in: path, required: true, schema: { type: string, format: uuid } }
    agentId: { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    runnerId: { name: runnerId, in: path, required: true, schema: { type: string, format: uuid } }
    pluginName: { name: pluginName, in: path, required: true, schema: { type: string } }
    invitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    automationKey: { name: automationKey, in: path, required: true, schema: { type: string } }
    conversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    messageId: { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    memberKind: { name: memberKind, in: path, required: true, schema: { type: string, enum: [user, agent] } }
    memberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    emoji: { name: emoji, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    attachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    brainEntryId: { name: brainEntryId, in: path, required: true, schema: { type: string, format: uuid } }
    listLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    listOffset: { name: offset, in: query, required: false, description: "rows to skip, for the next page", schema: { type: integer, minimum: 0 } }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ConversationList:
      description: one page of conversations; X-Has-More says whether another page follows (ask with offset)
      headers:
        X-Has-More: { schema: { type: boolean } }
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } }
  schemas:
    MessageOrigin:
      type: object
      additionalProperties: true
      description: "Where a message came from: {turn, job} for an agent's, {provider, external_ref} for one a bridge brought in (provider is the plugin: slack, github, or a2a for an A2A client); {} otherwise. A bridge never hears back a message whose provider is its own."
      properties:
        turn: { type: string, format: uuid }
        job: { type: string, format: uuid }
        provider: { type: string }
        external_ref: { type: string, description: "where it is outside, in the provider's terms: T0123/C0456/1700000000.000100, owner/name#12/comment/77" }
    NewRemoteAgent:
      type: object
      required: [handle, cardUrl]
      properties:
        handle: { type: string, description: "what people type after @; not taken in the project or the workspace" }
        cardUrl: { type: string, description: "the Agent Card, or the agent's base address (/.well-known/agent-card.json is added)" }
        token: { type: string, writeOnly: true, description: "the bearer token its endpoint takes; kept encrypted, never shown" }
        displayName: { type: string, description: "default: the card's name" }
    RemoteAgentInfo:
      type: object
      description: "What Gator keeps of a remote agent's card. Never its credential, only whether there is one."
      required: [cardUrl, url, name, hasCredential]
      properties:
        cardUrl: { type: string }
        url: { type: string, description: "its JSON-RPC endpoint" }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        skills: { type: array, items: { $ref: "#/components/schemas/A2ASkill" } }
        hasCredential: { type: boolean }
        fetchedAt: { type: string, format: date-time }
    A2ASkill:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
    NewA2AClient:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "1–40 lowercase letters, digits and dashes; its channel is #a2a-<name>" }
        dailyBudgetUsd: { type: number, format: double, minimum: 0 }
        perMinute: { type: integer, minimum: 1, maximum: 600 }
    A2AClient:
      type: object
      required: [id, projectId, name, dailyBudgetUsd, perMinute, spentTodayUsd, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        dailyBudgetUsd: { type: number, format: double }
        perMinute: { type: integer }
        spentTodayUsd: { type: number, format: double, description: "the cost of the turns it asked for since 00:00 UTC, jobs still running at their cap" }
        identityId: { type: string, format: uuid, description: "who it is in its channel (an outside identity, provider a2a)" }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    A2AClientCreated:
      type: object
      required: [client, token]
      properties:
        client: { $ref: "#/components/schemas/A2AClient" }
        token: { type: string, description: "gtr_a2a_…; shown once" }
    AgentA2A:
      type: object
      required: [exposed]
      properties:
        exposed: { type: boolean }
    AgentA2AState:
      type: object
      required: [agent, exposed]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        exposed: { type: boolean }
        url: { type: string, description: "where clients call it (when exposed)" }
        cardUrl: { type: string, description: "its Agent Card (when exposed)" }
    A2AAgentCard:
      type: object
      description: "An A2A 0.3 Agent Card."
      required: [protocolVersion, name, description, url, version, capabilities, defaultInputModes, defaultOutputModes, skills]
      properties:
        protocolVersion: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string }
        preferredTransport: { type: string }
        version: { type: string }
        capabilities: { type: object, additionalProperties: true }
        defaultInputModes: { type: array, items: { type: string } }
        defaultOutputModes: { type: array, items: { type: string } }
        skills: { type: array, items: { $ref: "#/components/schemas/A2ASkill" } }
        securitySchemes: { type: object, additionalProperties: true }
        security: { type: array, items: { type: object, additionalProperties: true } }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { description: "a string or a number" }
        method: { type: string, description: "message/send, tasks/get" }
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string }
        id: { description: "the request's" }
        result: { type: object, additionalProperties: true, description: "an A2A Task: {kind: task, id, contextId, status: {state, message?}, artifacts?, metadata?}" }
        error: { type: object, properties: { code: { type: integer }, message: { type: string } } }
    NewExternalLink:
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "the bridge's plugin name (slack); one that takes no link codes is 400" }
    ExternalLinkCode:
      type: object
      required: [code, provider, expiresAt]
      properties:
        code: { type: string, description: "GTR-XXXX-XXXX-XXXX-XXXX; shown once" }
        provider: { type: string }
        expiresAt: { type: string, format: date-time }
    ExternalIdentity:
      type: object
      description: "An account on a bridge, as one project knows it: the same Slack user in two projects is two identities."
      required: [id, projectId, provider, externalId, displayName, linked, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        provider: { type: string, description: "the bridge (plugin) that vouches for it" }
        externalId: { type: string, description: "in the provider's namespace: T0123/U0456 for Slack" }
        displayName: { type: string, description: "as the outside gave it; outside words, not verified" }
        linked: { type: boolean }
        userId: { type: string, format: uuid, description: "the person it is linked to" }
        linkedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string } }
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Readiness:
      type: object
      required: [checks]
      properties: { checks: { type: object, additionalProperties: { type: string } } }
    Version:
      type: object
      required: [version, commit, date]
      properties: { version: { type: string }, commit: { type: string }, date: { type: string } }
    Capabilities:
      type: object
      required: [features, protocolVersion]
      properties:
        features: { type: array, items: { type: string } }
        protocolVersion: { type: integer }
    ProjectRepo:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, description: "https://, ssh (git@host:path), file://, an absolute path, or GitHub shorthand owner/repo" }
        defaultBranch: { type: string }
        primary: { type: boolean }
    NewJob:
      type: object
      properties:
        backend: { type: string, description: "claude, or acp:<agent> for an agent speaking ACP through a runner (GATOR_ACP_AGENTS); defaults to the project's policy for the role" }
        model: { type: string, description: "defaults to the policy's model when the backend is the policy's" }
        maxCostUsd: { type: number, format: double, minimum: 0, description: "cost cap for this job; defaults to the policy's" }
        instruction: { type: string }
        role: { type: string }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        timeoutSeconds: { type: integer, minimum: 60 }
        maxToolCalls: { type: integer, minimum: 1 }
        placement: { type: string, enum: [local, cloud], default: local, description: "local runs on a machine of the person starting the job (or a shared one); cloud on a cloud runner" }
        allowAgents: { type: boolean, default: false, description: "the caller allows agents to work on this task without asking, recorded before the job is queued, in the same step; see allowAgents" }
    Job:
      type: object
      required: [id, taskId, projectId, phase, role, backend, instruction, status, attempts, maxAttempts, createdAt, placement, kind, tier]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        phase: { type: string }
        role: { type: string }
        agentId: { type: string, format: uuid, description: "the agent whose work this is: the one a turn named, or the agent playing the role" }
        turnId: { type: string, format: uuid, description: "the conversation turn a reply answers" }
        kind: { type: string, enum: [phase, reply, summary], description: "a phase of the process, an answer in a conversation, or the summary of one" }
        tier: { type: string, enum: [chat, work], description: "chat reads and answers with no tools that write; work changes code on a gator/ branch" }
        backend: { type: string }
        placement: { type: string, enum: [local, cloud], description: "where the job runs" }
        model: { type: string }
        instruction: { type: string }
        status: { type: string, enum: [queued, leased, running, stalled, done, failed, stopped] }
        runnerId: { type: string, format: uuid }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        leaseExpiresAt: { type: string, format: date-time }
        lastEventAt: { type: string, format: date-time }
        stopReason: { type: string }
        receipt: { type: object, additionalProperties: true }
        contextBytes: { type: integer, description: "how much of the prompt was documents this job was handed" }
        contextDocs: { type: integer, description: "how many documents" }
        objections: { type: integer, description: "how many times this turn was sent back to work before it was allowed to end" }
        capabilities: { $ref: "#/components/schemas/BackendCapabilities" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Checkpoint:
      type: object
      description: One turn of a job, checkpointed. files and the diff are the turn's; wholeFiles and the whole diff are the job's up to it.
      required: [id, jobId, seq, repo, baseCommit, headCommit, files, diffBytes, truncated, wholeFiles, wholeBytes, wholeTruncated, tookMs, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        turnId: { type: string, format: uuid, description: "the conversation turn the job answered, for a reply" }
        seq: { type: integer, description: "the turn of the job: 1 is the first, then one more after every steer or objection" }
        repo: { type: string }
        baseCommit: { type: string, description: "the checkpoint before (the worktree as the job found it, for seq 1); on the runner only" }
        headCommit: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/FileChange" } }
        diffBytes: { type: integer, format: int64 }
        truncated: { type: boolean, description: "the turn's diff was cut at 1 MiB" }
        wholeFiles: { type: array, items: { $ref: "#/components/schemas/FileChange" } }
        wholeBytes: { type: integer, format: int64 }
        wholeTruncated: { type: boolean }
        tookMs: { type: integer, description: "how long the runner took to checkpoint (checkpoint_ms)" }
        createdAt: { type: string, format: date-time }
    RuntimeRequest:
      type: object
      description: An agent waiting for a person mid-turn. The card is tool_approval (or question), keyed approval:<id>, in the task's thread.
      required: [id, jobId, kind, input, rule, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        turnId: { type: string, format: uuid }
        kind: { type: string, enum: [tool_approval, question] }
        tool: { type: string }
        input: { type: object, additionalProperties: true, description: "the tool's input, redacted like logs" }
        rule: { type: string, description: "the rule of the approvals policy that asks; empty for a question" }
        status: { type: string, enum: [pending, allowed, allowed_for_session, denied, expired, cancelled], x-enum-varnames: [RequestPending, RequestAllowed, RequestAllowedForSession, RequestDenied, RequestExpired, RequestCancelled] }
        stopped: { type: boolean, description: "denied by stopping the turn" }
        feedback: { type: string, description: "why it was denied, or the answer to a question" }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RuntimeDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, allow_for_session, deny, stop], x-enum-varnames: [DecideAllow, DecideAllowForSession, DecideDeny, DecideStop] }
        feedback: { type: string, maxLength: 4000, description: "the reason of a denial, which the agent reads; the answer to a question" }
    NewReviewComment:
      type: object
      required: [path, side, lineStart, body]
      properties:
        path: { type: string }
        side: { type: string, enum: [old, new] }
        lineStart: { type: integer, minimum: 1 }
        lineEnd: { type: integer, minimum: 1, description: "default lineStart; at most 500 lines" }
        body: { type: string, maxLength: 8000 }
    ReviewComment:
      type: object
      required: [id, checkpointId, authorId, path, side, lineStart, lineEnd, body, snippet, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        checkpointId: { type: string, format: uuid }
        checkpointSeq: { type: integer, description: "the turn it is on (in a job's list)" }
        authorId: { type: string, format: uuid }
        path: { type: string }
        side: { type: string, enum: [old, new] }
        lineStart: { type: integer }
        lineEnd: { type: integer }
        body: { type: string }
        snippet: { type: string, description: "the lines it is about as the diff showed them, each with its diff marker" }
        messageId: { type: string, format: uuid, description: "the message it went to the agent with; absent for a draft" }
        state: { type: string, enum: [draft, sent, resolved], x-enum-varnames: [CommentDraft, CommentSent, CommentResolved] }
        resolvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewCommentChange:
      type: object
      properties:
        body: { type: string, maxLength: 8000 }
        resolved: { type: boolean }
    SendReviewComments:
      type: object
      properties:
        agentId: { type: string, format: uuid, description: "the agent the notes are for; default the job's" }
    SentReviewComments:
      type: object
      required: [message, sent]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        sent: { type: integer, description: "how many comments went with it" }
    FileChange:
      type: object
      required: [path, added, removed, status]
      properties:
        path: { type: string }
        added: { type: integer }
        removed: { type: integer }
        status: { type: string, enum: [added, modified, deleted], x-enum-varnames: [FileAdded, FileModified, FileDeleted] }
        binary: { type: boolean, description: "changed, with no line counts and nothing of it in the diff" }
    JobEvent:
      type: object
      required: [seq, type, at, payload]
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string }
        at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    ContextPackage:
      type: object
      required: [documents, bytes, dropped]
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/ContextDocument" } }
        bytes: { type: integer, description: "what reached the prompt, in bytes" }
        dropped: { type: integer, description: "documents left out entirely" }
    ContextDocument:
      type: object
      required: [kind, title, bytes, fullBytes, dropped]
      properties:
        kind: { type: string }
        phase: { type: string }
        title: { type: string }
        origin: { type: string, description: "conversation | task | catalogue | product | knowledge | artifact | plugin" }
        body: { type: string, description: "as it went into the prompt; empty when the document was left out" }
        bytes: { type: integer }
        fullBytes: { type: integer, description: "its length before trimming" }
        leftOut: { type: string, description: "why it did not arrive whole; empty when it did" }
        dropped: { type: boolean }
    AgentCall:
      type: object
      required: [command, detail, at]
      properties:
        command: { type: string, description: "task show | task blocked | ask | artifact put | product propose | catalogue show | knowledge search" }
        detail: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    StopJob:
      type: object
      properties: { reason: { type: string } }
    SteerJob:
      type: object
      required: [message]
      properties: { message: { type: string } }
    LoginRequest:
      type: object
      required: [backend]
      properties: { backend: { type: string } }
    RunnerCapabilities:
      type: object
      required: [backends, maxParallel, projects]
      properties:
        backends: { type: array, items: { type: string } }
        maxParallel: { type: integer }
        projects: { type: array, items: { type: string } }
        canLogin: { type: boolean, description: "this runner can drive an interactive backend login; when false, asking it to is refused" }
        readOnly: { type: array, items: { type: string }, description: "its backends that keep a chat job read-only; absent from a runner that says nothing (every backend)" }
        noTools: { type: array, items: { type: string }, description: "its backends that run a summary with no tools; absent from a runner that says nothing (every backend)" }
        perBackend:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BackendCapabilities" }
          description: "what each backend can do in a live session (protocol v4); a backend missing here can do none of it"
    BackendCapabilities:
      type: object
      description: |
        What one backend of a runner can do while a job runs. Every flag false is a backend that
        restarts to steer, kills to stop and never asks before a tool (a v3 runner, or Claude Code in
        print mode).
      required: [activeSteering, steeringInterruptsTool, nativeInterrupt, toolApprovals, approvalsLiveOnly, streamsText, streamsReasoning, attachments, checkpoints, enforcement]
      properties:
        activeSteering: { type: boolean, description: "a message reaches the running turn without restarting it; without it Steer interrupts and resumes" }
        steeringInterruptsTool: { type: boolean, description: "a steer interrupts the tool that is running" }
        nativeInterrupt: { type: boolean, description: "Stop ends the turn without killing the process (within about 2 s)" }
        toolApprovals: { type: boolean, description: "the backend asks before a tool the project's approvals policy names, and waits (tool_approval cards)" }
        approvalsLiveOnly: { type: boolean, description: "an approval still waiting when the process dies is lost (the agent is told no)" }
        streamsText: { type: boolean }
        streamsReasoning: { type: boolean }
        attachments: { type: boolean, description: "takes images as images; without it the agent gets files as paths only" }
        checkpoints: { type: boolean, description: "the runner checkpoints the worktree after every turn (GET /jobs/{id}/checkpoints)" }
        enforcement: { type: string, enum: [native, runner, ""], description: "who holds the agent to its tier: the CLI's own flags, or the runner answering its permission requests" }
    RunnerInfo:
      type: object
      required: [id, name, location, placement, status, connected, capabilities, authState, protocolVersion, binaryVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        location: { type: string }
        placement: { type: string, enum: [local, cloud], description: "which jobs it takes: local ones (a person's own machine) or cloud ones" }
        ownerId: { type: string, format: uuid, description: "the person whose machine it is; absent for a shared runner" }
        status: { type: string, enum: [online, busy, offline] }
        connected: { type: boolean }
        capabilities: { $ref: "#/components/schemas/RunnerCapabilities" }
        authState: { type: object, additionalProperties: { type: string } }
        protocolVersion: { type: integer }
        binaryVersion: { type: string }
        lastHeartbeatAt: { type: string, format: date-time }
        offlineSince: { type: string, format: date-time, description: "when it stopped answering; absent while it is connected" }
        offlineReason: { type: string, description: "disconnected, or no heartbeat" }
        jobs: { type: array, items: { $ref: "#/components/schemas/RunnerJob" }, description: "what it is working on now" }
    RunnerJob:
      type: object
      required: [id, taskId, taskTitle, phase, role, backend, status]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        phase: { type: string }
        role: { type: string }
        backend: { type: string }
        status: { type: string }
        startedAt: { type: string, format: date-time }
    UsageInput:
      type: object
      required: [durationMs]
      properties:
        jobId: { type: string, format: uuid }
        phase: { type: string, description: defaults to the task's current phase }
        backend: { type: string }
        model: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadTokens: { type: integer, format: int64, minimum: 0 }
        cacheWriteTokens: { type: integer, format: int64, minimum: 0 }
        costUsd: { type: number, format: double, minimum: 0 }
        costEstimated: { type: boolean, description: true when priced from list rates (subscriptions) }
        durationMs: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    UsageAck:
      type: object
      required: [recorded]
      properties: { recorded: { type: boolean } }
    Tokens:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    PhaseMetrics:
      type: object
      required: [phase, owner, visits, seconds, blockedSeconds, agentSeconds, workSeconds, queueSeconds, waitingSeconds, tokens, costUsd, jobs]
      properties:
        phase: { type: string }
        owner: { type: string, description: "human | runner | plugin, from the template" }
        visits: { type: integer, description: times the task entered this phase (rollbacks add visits) }
        seconds: { type: number, format: double, description: wall time spent in the phase }
        blockedSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double, description: time agents ran during this phase }
        workSeconds: { type: number, format: double, description: job wall time from start to finish }
        queueSeconds: { type: number, format: double, description: jobs waiting for a runner }
        waitingSeconds: { type: number, format: double, description: "rest of the phase time, waiting for a person" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        jobs: { type: integer }
    TaskMetrics:
      type: object
      required: [taskId, closed, leadSeconds, blockedSeconds, agentSeconds, workSeconds, queueSeconds, waitingSeconds, state, tokens, costUsd, costEstimated, jobs, phases]
      properties:
        taskId: { type: string, format: uuid }
        closed: { type: boolean }
        leadSeconds: { type: number, format: double, description: "created to closed, or to now while open" }
        blockedSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double }
        workSeconds: { type: number, format: double, description: "lead = work + queue + blocked + waiting" }
        queueSeconds: { type: number, format: double }
        waitingSeconds: { type: number, format: double, description: nobody working; the task waits for a person }
        state: { $ref: "#/components/schemas/TaskState" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        costEstimated: { type: boolean, description: true if any part of the cost is an estimate }
        jobs: { type: integer }
        phases: { type: array, items: { $ref: "#/components/schemas/PhaseMetrics" } }
    TaskState:
      type: object
      required: [kind, since]
      properties:
        kind: { type: string, enum: [closed, blocked, agent_stalled, agent_working, queued, waiting_for_human] }
        since: { type: string, format: date-time }
    KindMetrics:
      type: object
      required: [kind, tasks, closedTasks, avgLeadSeconds, agentSeconds, tokens, costUsd, jobs]
      properties:
        kind: { type: string }
        tasks: { type: integer, format: int64 }
        closedTasks: { type: integer, format: int64 }
        avgLeadSeconds: { type: number, format: double }
        agentSeconds: { type: number, format: double }
        tokens: { $ref: "#/components/schemas/Tokens" }
        costUsd: { type: number, format: double }
        jobs: { type: integer, format: int64 }
    Budget:
      type: object
      required: [dailyLimitUsd, spentTodayUsd, estimated]
      properties:
        dailyLimitUsd: { type: number, format: double, description: "0 means no limit is set" }
        spentTodayUsd: { type: number, format: double }
        estimated: { type: boolean, description: "true while any of the spend comes from a subscription, where cost is an estimate" }
    ProjectMetrics:
      type: object
      required: [projectId, since, byKind, totals]
      properties:
        projectId: { type: string, format: uuid }
        since: { type: string, format: date-time }
        byKind: { type: array, items: { $ref: "#/components/schemas/KindMetrics" } }
        totals: { $ref: "#/components/schemas/KindMetrics" }
    Me:
      type: object
      required: [kind, name, workspaceRole]
      properties:
        kind: { type: string }
        userId: { type: string, format: uuid }
        name: { type: string }
        workspaceRole: { type: string }
        scope: { type: string }
    NewToken:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [user, runner, plugin] }
        name: { type: string }
        projectId: { type: string, format: uuid, description: required for plugin tokens }
        ttlHours: { type: integer }
    Token:
      type: object
      required: [id, kind, scope, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        scope: { type: string }
        name: { type: string }
        projectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    IssuedToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "plaintext, shown once" }
    Member:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [admin, member, viewer] }
    NewProject:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        preset: { type: string, description: "name of a project preset to start from; its vision, principles, process, packs and repository are copied, never shared" }
        repoUrl: { type: string, description: "the project's repository; same forms as ProjectRepo.url" }
        defaultBranch: { type: string, description: "branch work starts from; main when omitted" }
    # A saved starting point for a new project. Named "preset" because "template" already
    # means the process template per kind of task, and two meanings for one word in an API is
    # a bug waiting to be written.
    ProjectPreset:
      type: object
      required: [id, name, description, packs, product, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        packs: { type: array, items: { type: string }, description: "knowledge packs a project from this template switches on" }
        product: { type: array, items: { $ref: "#/components/schemas/PresetEntry" } }
        repoUrl: { type: string, description: "repository a new project starts with, if any" }
        hasProcess: { type: boolean, description: "whether the template carries a process configuration" }
        createdAt: { type: string, format: date-time }
    PresetEntry:
      type: object
      required: [kind, title, content]
      properties:
        kind: { type: string }
        title: { type: string }
        content: { type: string }
    NewProjectPreset:
      type: object
      required: [name, fromProjectId]
      properties:
        name: { type: string }
        description: { type: string }
        fromProjectId: { type: string, format: uuid, description: "the project to snapshot" }
    ArchiveProject:
      type: object
      required: [archived]
      properties:
        archived: { type: boolean }
    Project:
      type: object
      required: [id, slug, name, tags, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, description: "set while the project is archived" }
        role: { type: string, enum: [admin, member, viewer], description: "the caller's role in the project; absent for runners and plugins" }
    NewDevice:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: APNs device token }
        platform: { type: string, enum: [ios, macos] }
        appVersion: { type: string }
    Device:
      type: object
      required: [id, platform, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeEntry:
      type: object
      required: [id, scope, title, content, position, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: absent for a workspace-wide entry }
        scope: { type: string, enum: [language, architecture, requirements, testing, security] }
        title: { type: string }
        content: { type: string }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    NewKnowledgeEntry:
      type: object
      required: [scope, title, content]
      properties:
        scope: { type: string, enum: [language, architecture, requirements, testing, security] }
        title: { type: string }
        content: { type: string }
        position: { type: integer }
    KnowledgePack:
      type: object
      required: [id, name, version, scope, checksum, files]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        scope: { type: string }
        url: { type: string }
        checksum: { type: string }
        appliesTo: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
        phases: { type: array, items: { type: string } }
        files: { type: array, items: { type: string } }
        enabled: { type: boolean, description: present when listed for a project }
        fetchedAt: { type: string, format: date-time }
    FetchPacks:
      type: object
      required: [url]
      properties:
        url: { type: string, description: git url of the registry }
    ProjectPack:
      type: object
      required: [name]
      properties:
        name: { type: string }
        version: { type: string, description: defaults to the newest stored }
        position: { type: integer }
    KnowledgePreview:
      type: object
      required: [documents, warnings, bytes]
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/PreviewDocument" } }
        warnings: { type: array, items: { type: string } }
        bytes: { type: integer, description: size of the technical part of the prompt }
    PreviewDocument:
      type: object
      required: [title, scope, body]
      properties:
        title: { type: string }
        scope: { type: string }
        body: { type: string }
    User:
      type: object
      required: [id, name, email, workspaceRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        workspaceRole: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
    ProjectMember:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, member, viewer] }
    ProjectCandidate:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
    NewInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, member, viewer] }
    Invitation:
      type: object
      required: [id, projectId, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, member, viewer] }
        invitedBy: { type: string, format: uuid }
        invitedByName: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    IssuedInvitation:
      type: object
      required: [invitation, link, appLink, emailed]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        link: { type: string, description: "https address on this server that opens Gator.app with the invitation" }
        appLink: { type: string, description: "gator://invite/<token>, for someone who already has Gator.app" }
        emailed: { type: boolean, description: "whether the server sent the link itself; when false, the inviter passes it on" }
    AcceptInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ProjectConfig:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: true, description: "process_config as stored: templates, roles, autopilot, policy" }
    Campaign:
      type: object
      required: [targets, done, blocked, waiting, skipped]
      properties:
        targets: { type: array, items: { $ref: "#/components/schemas/CampaignTarget" } }
        done: { type: integer }
        blocked: { type: integer }
        waiting: { type: integer }
        skipped: { type: integer }
    CampaignTarget:
      type: object
      required: [key, skipped]
      properties:
        key: { type: string, description: "a component key, or another project's slug" }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        title: { type: string }
        phase: { type: string }
        closed: { type: boolean }
        blocked: { type: string, description: "why this target cannot move; empty when it can" }
        skipped: { type: boolean }
        skipReason: { type: string }
    CampaignTargets:
      type: object
      required: [targets]
      properties:
        instruction: { type: string, description: "carried into every target's task, so an agent has the whole decision" }
        targets: { type: array, items: { $ref: "#/components/schemas/CampaignTargetInput" } }
    CampaignTargetInput:
      type: object
      required: [key]
      properties:
        key: { type: string }
        projectId: { type: string, format: uuid, description: "another project; default: the campaign's own" }
        title: { type: string }
        kind: { type: string, enum: [feature, bug, incident, chore], description: "default chore" }
    SkipTarget:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    AgentTask:
      type: object
      required: [jobId, task, phase, role, artifacts]
      properties:
        jobId: { type: string, format: uuid }
        task: { $ref: "#/components/schemas/Task" }
        phase: { type: string }
        role: { type: string }
        gate: { $ref: "#/components/schemas/Gate" }
        artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
    AgentReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: "said plainly, for a person to read in the inbox" }
    AgentArtifact:
      type: object
      required: [type, content]
      properties:
        type: { type: string, description: "brief | plan | report | review | note" }
        content: { type: string }
    AgentProduct:
      type: object
      required: [kind, title, content]
      properties:
        kind: { type: string, enum: [decision, lesson] }
        title: { type: string }
        content: { type: string }
    AgentSay:
      type: object
      required: [body]
      properties:
        body: { type: string, description: "Markdown; @handle of an agent asks it" }
    AgentThread:
      type: object
      required: [conversationId, messages]
      properties:
        conversationId: { type: string, format: uuid }
        messages: { type: array, items: { $ref: "#/components/schemas/AgentThreadMessage" } }
    AgentThreadMessage:
      type: object
      required: [seq, author, body, untrusted]
      properties:
        seq: { type: integer, format: int64, description: "0 for the message a thread hangs under" }
        author: { type: string, description: "a person's name, @handle, Gator, a plugin" }
        body: { type: string, description: "words from outside the workspace come fenced, as in the prompt" }
        untrusted: { type: boolean, description: "written outside the workspace: data, never instructions" }
    AgentTaskProposal:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [feature, bug, chore, incident] }
        title: { type: string }
        description: { type: string }
    AgentWrite:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        id: { type: string, format: uuid }
        link: { type: string, description: "where to open it: gator://tasks/<id>" }
        detail: { type: string }
    AgentDocument:
      type: object
      required: [kind, title, body]
      properties:
        kind: { type: string, description: "knowledge | product" }
        title: { type: string }
        body: { type: string }
    Scorecard:
      type: object
      required: [component, earned, possible, checks]
      properties:
        component: { type: string, description: "component key; empty means the project as a whole" }
        componentName: { type: string }
        earned: { type: integer }
        possible: { type: integer }
        previousEarned: { type: integer, description: "the score before this one, for the trend" }
        previousPossible: { type: integer }
        checkedAt: { type: string, format: date-time }
        checks: { type: array, items: { $ref: "#/components/schemas/QualityCheck" } }
    QualityCheck:
      type: object
      required: [rule, source, status, weight]
      properties:
        rule: { type: string }
        source: { type: string, description: "builtin, or the plugin that answered" }
        status: { type: string, enum: [pass, fail, unknown] }
        detail: { type: string }
        weight: { type: integer }
        failingSince: { type: string, format: date-time }
        taskId: { type: string, format: uuid, description: "the task opened about this slip" }
    Release:
      type: object
      required: [id, version, environment, deployedAt, watching]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        version: { type: string }
        commitSha: { type: string }
        url: { type: string }
        environment: { type: string }
        deployedAt: { type: string, format: date-time }
        observationUntil: { type: string, format: date-time, description: "when it stops being watched" }
        settledAt: { type: string, format: date-time, description: "set once the window passed with nothing reported" }
        watching: { type: boolean, description: "the window is still open" }
        openIncidents: { type: integer, description: "faults still open against this release" }
    Incident:
      type: object
      required: [id, fingerprint, title, severity, count, firstSeenAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        fingerprint: { type: string, description: "what makes one fault one incident" }
        title: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        url: { type: string }
        count: { type: integer, description: "how many times it has been reported" }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    Component:
      type: object
      required: [id, key, name, kind, dependsOn, usedBy, decisions]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: "short handle, unique in the project" }
        name: { type: string }
        kind: { type: string, enum: [app, api, lib, infra] }
        repo: { type: string }
        path: { type: string }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        notes: { type: string }
        dependsOn: { type: array, items: { type: string }, description: "keys of components this one needs" }
        usedBy: { type: array, items: { type: string }, description: "keys of components a change here reaches" }
        decisions: { type: array, items: { $ref: "#/components/schemas/ProductEntry" }, description: "approved decisions that shaped it" }
        status: { type: string, enum: [approved, proposed], description: "a proposed component was worked out from where jobs change code; it reaches no prompt until approved" }
        proposedReason: { type: string, description: "why the server suggested it" }
    ComponentInput:
      type: object
      required: [key, name, kind]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [app, api, lib, infra] }
        repo: { type: string }
        path: { type: string }
        ownerId: { type: string, format: uuid }
        notes: { type: string }
        dependsOn: { type: array, items: { type: string }, description: "replaces the dependencies; keys must exist in this project" }
        decisions: { type: array, items: { type: string, format: uuid }, description: "replaces the linked decisions" }
    TaskComponent:
      type: object
      properties:
        key: { type: string, description: "component key, or absent to clear" }
    BrainScope: { type: string, enum: [workspace, project, component, user, agent] }
    BrainKind:
      type: string
      enum: [vision, principle, persona, glossary, decision, lesson, roadmap, convention, runbook, fact, expertise, focus, preference]
    BrainStatus: { type: string, enum: [proposed, approved, rejected, superseded, archived] }
    BrainVisibility: { type: string, enum: [private, scope, project, workspace], description: "scope: the scope's own rule; a person's entry is theirs unless project or workspace" }
    BrainSource:
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: "manual | message | task | job | plugin | import | pack" }
        id: { type: string }
        url: { type: string }
        excerpt: { type: string, description: "a quote of the source; never kept for a private conversation" }
        name: { type: string, description: "the plugin or pack it came from" }
    BrainEntry:
      type: object
      required: [id, lineage, scope, kind, title, content, visibility, status, version, confidence, source, private, createdByKind, validFrom, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        lineage: { type: string, format: uuid, description: "shared by every version of one entry" }
        scope: { $ref: "#/components/schemas/BrainScope" }
        projectId: { type: string, format: uuid }
        componentKey: { type: string }
        userId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BrainKind" }
        topic: { type: string, description: "a convention's shelf: language, architecture, requirements, testing, security" }
        title: { type: string }
        content: { type: string }
        visibility: { $ref: "#/components/schemas/BrainVisibility" }
        status: { $ref: "#/components/schemas/BrainStatus" }
        version: { type: integer }
        supersedes: { type: string, format: uuid, description: the version before this one }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, description: "when it stopped being true (superseded, archived)" }
        confidence: { type: string, enum: [stated, inferred] }
        source: { $ref: "#/components/schemas/BrainSource" }
        sourceTaskId: { type: string, format: uuid }
        sourceConversationId: { type: string, format: uuid }
        private: { type: boolean, description: "came from a private conversation: until approved, only its readers see it" }
        createdByKind: { type: string, description: "user | runner | plugin | system" }
        createdBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, description: folded into a condensed entry }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BrainHit:
      type: object
      required: [id, title, excerpt, scope, kind, status, version, source]
      description: one search result, the same for the REST API and the MCP server's brain_search
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        scope: { $ref: "#/components/schemas/BrainScope" }
        kind: { $ref: "#/components/schemas/BrainKind" }
        status: { $ref: "#/components/schemas/BrainStatus" }
        version: { type: integer }
        projectId: { type: string, format: uuid }
        componentKey: { type: string }
        source: { $ref: "#/components/schemas/BrainSource" }
        rank: { type: number, format: float }
    BrainLinkInput:
      type: object
      required: [targetKind, targetId]
      properties:
        targetKind: { type: string, enum: [entry, component, task, conversation] }
        targetId: { type: string }
        relation: { type: string, enum: [relates, depends_on, contradicts, implements], default: relates }
    BrainLink:
      allOf:
        - $ref: "#/components/schemas/BrainLinkInput"
        - type: object
          required: [relation, createdAt]
          properties:
            createdAt: { type: string, format: date-time }
    BrainCitation:
      type: object
      required: [jobId, taskId, role, how, at]
      properties:
        jobId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        role: { type: string }
        how: { type: string, enum: [packed, searched, cited] }
        at: { type: string, format: date-time }
    BrainDetail:
      type: object
      required: [entry, versions, links, citations]
      properties:
        entry: { $ref: "#/components/schemas/BrainEntry" }
        versions: { type: array, items: { $ref: "#/components/schemas/BrainEntry" }, description: "every version, newest first" }
        links: { type: array, items: { $ref: "#/components/schemas/BrainLink" } }
        citations: { type: array, items: { $ref: "#/components/schemas/BrainCitation" } }
    NewBrainEntry:
      type: object
      required: [scope, kind, title, content]
      properties:
        scope: { $ref: "#/components/schemas/BrainScope" }
        kind: { $ref: "#/components/schemas/BrainKind" }
        title: { type: string }
        content: { type: string }
        projectId: { type: string, format: uuid, description: "for project, component and agent entries, and a person's entry shared with a project" }
        componentKey: { type: string }
        agentId: { type: string, format: uuid }
        topic: { type: string, enum: [language, architecture, requirements, testing, security] }
        visibility: { $ref: "#/components/schemas/BrainVisibility" }
        propose: { type: boolean, description: "propose it even if you may approve it" }
        links: { type: array, items: { $ref: "#/components/schemas/BrainLinkInput" } }
    BrainPatch:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        visibility: { $ref: "#/components/schemas/BrainVisibility" }
        propose: { type: boolean }
    BrainSample:
      type: object
      required: [jobs, medianContextBytes, advances, rollbacks, rollbackRate]
      properties:
        jobs: { type: integer }
        medianContextBytes: { type: integer }
        advances: { type: integer }
        rollbacks: { type: integer }
        rollbackRate: { type: number, format: double }
    BrainImpact:
      type: object
      required: [before, after, contextGrowth, contextHeld, rollbacksFell]
      properties:
        before: { $ref: "#/components/schemas/BrainSample" }
        after: { $ref: "#/components/schemas/BrainSample" }
        contextGrowth: { type: number, format: double, description: "how much the median context grew, as a fraction" }
        contextHeld: { type: boolean, description: "it grew by at most 20%" }
        rollbacksFell: { type: boolean }
    FocusSetting:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        offSince: { type: string, format: date-time, description: "when it was turned off (or the caller asked to be forgotten)" }
    MyBrain:
      type: object
      required: [entries, agentsSee, focus]
      properties:
        focus: { $ref: "#/components/schemas/FocusSetting" }
        entries: { type: array, items: { $ref: "#/components/schemas/BrainEntry" }, description: "every version of every entry about the caller" }
        agentsSee: { type: string, description: "what agents are told of it, in a sentence" }
    Forgotten:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: "entries deleted" }
    ProductEntry:
      type: object
      required: [id, kind, title, content, version, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [vision, principles, persona, glossary, decision, lesson, roadmap] }
        title: { type: string }
        content: { type: string }
        version: { type: integer }
        status: { type: string, enum: [proposed, approved, archived] }
        sourceTaskId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
    NewProductEntry:
      type: object
      required: [kind, title, content]
      properties:
        kind: { type: string, enum: [vision, principles, persona, glossary, decision, lesson, roadmap] }
        title: { type: string }
        content: { type: string }
    ProductStatusChange:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, archived] }
    ProjectTemplate:
      type: object
      required: [kind, maxRollbacks, phases]
      properties:
        kind: { type: string }
        maxRollbacks: { type: integer }
        phases: { type: array, items: { $ref: "#/components/schemas/TemplatePhase" } }
        source: { type: string, enum: [project, workspace, default], description: "where the process in force comes from" }
    TemplatePhase:
      type: object
      required: [name, owner, gate, active]
      properties:
        name: { type: string }
        owner: { type: string, description: "human | runner | plugin" }
        role: { type: string, description: runner role for this phase }
        gate: { type: string, description: "human | auto | both" }
        requires: { type: string, description: plugin capability that activates the phase }
        timeout: { type: string, description: "how long the phase may take before the task is blocked, like 24h; 0 means no limit" }
        active: { type: boolean }
    InstallPlugin:
      type: object
      required: [command]
      properties:
        command: { type: array, minItems: 1, items: { type: string }, description: "argv of the plugin process on the server" }
    InstalledPlugin:
      type: object
      required: [name, version, command, capabilities, hooks, enabled]
      properties:
        name: { type: string }
        version: { type: string }
        command: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        hooks: { type: array, items: { type: string } }
        enabled: { type: boolean }
        manifest: { type: object, additionalProperties: true }
    ProjectPluginSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
    ProjectPlugin:
      type: object
      required: [name, version, enabled, running, capabilities, hooks, config, secretsSet]
      properties:
        name: { type: string }
        version: { type: string }
        enabled: { type: boolean }
        disabledReason: { type: string }
        running: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        hooks: { type: array, items: { type: string } }
        ui: { type: array, items: { type: string } }
        config: { type: object, additionalProperties: true, description: non-secret settings }
        secretsSet: { type: array, items: { type: string }, description: secret settings that hold a value }
        configSchema: { type: object, additionalProperties: true }
        description: { type: string }
        connect: { $ref: "#/components/schemas/PluginConnection" }
        webhookUrl: { type: string, description: "where the outside system should deliver webhooks, for setting one up by hand; absent when the server does not know its public address" }
    PluginConnection:
      type: object
      description: A plugin a person can connect by signing in at the provider, instead of pasting a token.
      required: [title, available, connected]
      properties:
        title: { type: string, description: 'the provider, for "Connect GitHub"' }
        available: { type: boolean, description: "this server has an OAuth app for the provider" }
        connected: { type: boolean, description: "the project holds a token from a connection or a pasted one" }
    CataloguePlugin:
      type: object
      required: [name, version, capabilities, installed]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string } }
        configSchema: { type: object, additionalProperties: true }
        installed: { type: boolean }
        connect: { $ref: "#/components/schemas/PluginConnection" }
    PluginConnectRequest:
      type: object
      properties:
        returnTo: { type: string, description: "gator://… or a loopback address to send the browser to afterwards" }
    PluginConnectStart:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "where the person's browser starts: Gator's /connect/start, which ties the connection to that browser and sends it on to the provider's sign-in page; a callback from any other browser is refused" }
    PluginImport:
      type: object
      required: [created, existing]
      properties:
        created: { type: integer }
        existing: { type: integer, description: already on the board }
        truncated: { type: boolean, description: there was more than one import brings in }
        note: { type: string }
    PluginCall:
      type: object
      required: [id, direction, method, durationMs, createdAt]
      properties:
        id: { type: integer, format: int64 }
        direction: { type: string, description: "core_to_plugin | plugin_to_core" }
        method: { type: string }
        payload: {}
        result: {}
        error: { type: string }
        durationMs: { type: integer }
        createdAt: { type: string, format: date-time }
    PluginUI:
      type: object
      required: [tabs, chips]
      properties:
        tabs: { type: array, items: { $ref: "#/components/schemas/PluginTab" } }
        chips: { type: array, items: { $ref: "#/components/schemas/PluginChip" } }
    PluginTab:
      type: object
      required: [plugin, title, markdown]
      properties:
        plugin: { type: string }
        title: { type: string }
        markdown: { type: string }
    PluginChip:
      type: object
      required: [plugin, text]
      properties:
        plugin: { type: string }
        text: { type: string }
        color: { type: string }
        url: { type: string }
    Automation:
      type: object
      required: [key, title, summary, creates, trigger, needs, usesAgents, available, enabled, settings]
      properties:
        key: { type: string, description: "pr_review, security_review, dependency_scan, error_triage or weekly_summary; more may come, so clients show what they do not know by its title" }
        title: { type: string }
        summary: { type: string, description: one line for the card }
        creates: { type: string, description: "what switching it on will create, in a sentence or two" }
        trigger: { type: string, description: "pull_request, weekly or incident" }
        needs: { type: string, description: "what the project must have first: github, monitoring, repository, or empty for nothing" }
        usesAgents: { type: boolean, description: "its tasks are worked on by agents, so switching it on needs allowAgents" }
        author: { type: string, description: "the role of the agent whose work it is (its default agent: reviewer, security_reviewer, worker, triage, reporter)" }
        available: { type: boolean, description: the project has what it needs }
        unavailableReason: { type: string, description: "what to do first, when not available" }
        enabled: { type: boolean }
        settings: { $ref: "#/components/schemas/AutomationSettings" }
        enabledBy: { type: string, format: uuid, description: "who switched it on: the person the tasks it creates name as having allowed agents" }
        enabledByName: { type: string }
        enabledAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time, description: when it last created a task }
        lastError: { type: string, description: "why the last run, or the last job of one of its tasks, failed; absent when it did not" }
        lastTaskId: { type: string, format: uuid, description: "the newest task it created, such as the latest weekly summary" }
        nextRunAt: { type: string, format: date-time, description: when a weekly automation that is on runs next }
    AutomationSettings:
      type: object
      properties:
        weekday: { type: string, description: "weekly automations: the day they run on, monday to sunday (09:00 UTC)" }
    AutomationChange:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        settings: { $ref: "#/components/schemas/AutomationSettings" }
        allowAgents: { type: boolean, description: "the person allows agents to work without asking on the tasks this automation creates; required to switch on one that uses agents" }
    NewTask:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [feature, bug, incident, chore, campaign] }
        title: { type: string }
        description: { type: string, description: "what the person wants, in their words; jobs get it in their prompt" }
        urgency: { type: integer, minimum: 1, maximum: 4 }
    TaskPatch:
      type: object
      description: fields left out stay as they are
      properties:
        title: { type: string }
        description: { type: string }
        kind: { type: string, enum: [feature, bug, incident, chore], description: "only before work on the task has started" }
        urgency: { type: integer, minimum: 1, maximum: 4 }
    TaskStateChange:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    Artifact:
      type: object
      required: [id, phase, type, version, approved, createdAt]
      properties:
        id: { type: string, format: uuid }
        phase: { type: string }
        type: { type: string }
        version: { type: integer }
        content: { type: string }
        url: { type: string }
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, projectId, kind, title, phase, urgency, requirementsChanged, phaseEnteredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        description: { type: string }
        origin: { type: string, enum: [internal, external], description: "external means the words came from outside the workspace — a webhook, an issue, an alert" }
        originSource: { type: string, description: "who raised it: a plugin's name, usually" }
        admittedAt: { type: string, format: date-time, description: "when a person let outside work through; until then nothing runs on it by itself" }
        agentsAllowedAt: { type: string, format: date-time, description: "when a person allowed agents to work on this task without asking; until then no job starts on it. Tasks that had a job before this was asked carry their first job's time and no agentsAllowedBy" }
        agentsAllowedBy: { type: string, format: uuid, description: "the person who allowed agents on this task" }
        automation: { type: string, description: "the key of the automation that created this task, such as pr_review; absent for tasks a person or a plugin created" }
        phase: { type: string }
        urgency: { type: integer }
        ownerKind: { type: string }
        ownerId: { type: string, format: uuid }
        requirementsChanged: { type: boolean }
        blockedReason: { type: string }
        phaseEnteredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [gate, phases]
          properties:
            gate: { $ref: "#/components/schemas/Gate" }
            phases: { type: array, items: { type: string }, description: active phases of this task's template in order }
    Gate:
      type: object
      required: [phase, kind, checks, humanApproved]
      properties:
        phase: { type: string }
        kind: { type: string, enum: [human, auto, both] }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        humanApproved: { type: boolean }
        blockedReason: { type: string }
        blockedBy: { type: string }
    Check:
      type: object
      required: [name, source, status]
      properties:
        name: { type: string }
        source: { type: string }
        status: { type: string, enum: [pass, fail, pending] }
        detail: { type: string }
    DashboardCounts:
      type: object
      required: [issues, errors]
      properties:
        issues:
          description: one per tracker plugin (capability tracker) switched on in a readable project
          type: array
          items: { $ref: "#/components/schemas/PluginCount" }
        errors:
          description: one per monitoring plugin (capability monitoring) switched on in a readable project
          type: array
          items: { $ref: "#/components/schemas/PluginCount" }
    PluginCount:
      type: object
      required: [projectId, plugin, open]
      properties:
        projectId: { type: string, format: uuid }
        plugin: { type: string, description: "the plugin's name, e.g. github or honeybadger" }
        open: { type: integer, minimum: 0 }
    Decision:
      type: object
      description: >-
        One thing waiting for a person. Most are about a task; with all=true some are about a
        component, a product entry, a runner or a plugin, and those carry no task.
      required: [id, reason, waitingSince, urgency, summary, subject, actions]
      properties:
        id: { type: string, description: "stable while the decision waits: task:<id>, component:<id>, product:<id>, runner:<id>:<backend>, plugin:<projectId>:<name>" }
        task: { $ref: "#/components/schemas/Task" }
        waitingSince: { type: string, format: date-time }
        reason:
          type: string
          enum: [approval, blocked, requirements_changed, idea, job_failed, no_runner, external,
                 job_stalled, alert, component_proposed, product_proposed, runner_login, plugin_disabled,
                 agents_not_allowed]
          description: "the last seven only with all=true. agents_not_allowed is a task the autopilot would start an agent on, once a person allows agents on it"
        urgency: { type: integer, minimum: 1, maximum: 4, description: "1 is the most urgent, as on a task. A task's decision carries the task's urgency, raised to 2 when the task cannot move by itself" }
        summary: { type: string, description: "what happened, in words a person reads" }
        subject: { $ref: "#/components/schemas/DecisionSubject" }
        jobId: { type: string, format: uuid, description: the job a job_failed or job_stalled decision is about }
        actions:
          type: array
          description: what the person can do from the decision itself, most likely first
          items: { $ref: "#/components/schemas/DecisionAction" }
        rollbacks: { type: integer, description: times this task was sent back into its current phase }
    DecisionSubject:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [task, component, product_entry, runner, plugin] }
        id: { type: string, description: "the subject's id; for a component, its key; for a plugin, its name" }
        projectId: { type: string, format: uuid }
        name: { type: string, description: "the title, name or key a person knows it by" }
        backend: { type: string, description: "for a runner_login decision, the backend that needs a login" }
    DecisionAction:
      type: string
      enum: [approve, admit, retry, stop_job, close, open,
             accept_component, reject_component, approve_entry, archive_entry, login_runner, enable_plugin,
             allow_agents]
    Reason:
      type: object
      properties: { reason: { type: string } }
    Rollback:
      type: object
      required: [to, reason]
      properties: { to: { type: string }, reason: { type: string } }
    Handoff:
      type: object
      required: [toKind, toId]
      properties:
        toKind: { type: string, enum: [user, runner] }
        toId: { type: string, format: uuid }
        reason: { type: string }
    Transition:
      type: object
      required: [id, toPhase, kind, actorKind, createdAt]
      properties:
        id: { type: integer, format: int64 }
        fromPhase: { type: string }
        toPhase: { type: string }
        kind: { type: string }
        actorKind: { type: string }
        actorId: { type: string, format: uuid }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, kind, topic, visibility, archived, createdAt, lastSeq, joined, lastReadSeq, unread, unreadMentions]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: absent for a DM outside every project }
        kind: { type: string, enum: [channel, dm, thread, task] }
        name: { type: string, description: channels only }
        topic: { type: string }
        visibility: { type: string, enum: [project, private] }
        parentMessageId: { type: string, format: uuid, description: "a thread's (or task thread's) root message" }
        taskId: { type: string, format: uuid, description: "kind task: the task this is the thread of" }
        componentKey: { type: string }
        archived: { type: boolean }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
        lastSeq: { type: integer, format: int64, description: the seq of the newest message }
        joined: { type: boolean, description: whether the caller is in it }
        lastReadSeq: { type: integer, format: int64 }
        notify: { type: string, enum: [all, mentions, none], description: "the caller's setting, when joined" }
        unread: { type: integer, format: int64, description: "messages after the caller's read marker; 0 when not joined" }
        unreadMentions: { type: integer, format: int64, description: unread messages that mention the caller }
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [members, rights]
          properties:
            members: { type: array, items: { $ref: "#/components/schemas/ConversationMember" } }
            rights: { $ref: "#/components/schemas/ConversationRights" }
    ConversationRights:
      type: object
      required: [read, react, write, moderate]
      description: what the caller may do; a viewer reads and reacts but does not write
      properties:
        read: { type: boolean }
        react: { type: boolean }
        write: { type: boolean }
        moderate: { type: boolean, description: "rename, archive, remove others, delete their messages" }
    ConversationMember:
      type: object
      required: [kind, id, role, notify, lastReadSeq, joinedAt]
      properties:
        kind: { type: string, enum: [user, agent] }
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        notify: { type: string, enum: [all, mentions, none] }
        lastReadSeq: { type: integer, format: int64 }
        joinedAt: { type: string, format: date-time }
    MemberRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, agent] }
        id: { type: string, format: uuid }
    NewChannel:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "1–80 of a–z, 0–9, '-' and '_'; lowercased, a leading # dropped" }
        topic: { type: string }
        visibility: { type: string, enum: [project, private], default: project }
        componentKey: { type: string, description: a channel for one component of the catalogue }
    NewDirectMessage:
      type: object
      required: [members]
      properties:
        members: { type: array, items: { type: string, format: uuid }, description: "people besides the caller (the caller may be listed too)" }
        agents: { type: array, items: { type: string, format: uuid }, description: "agents of the project in the DM; every person's message there asks them (needs projectId)" }
        projectId: { type: string, format: uuid, description: "a DM inside this project; omitted, outside every project" }
    ConversationPatch:
      type: object
      properties:
        name: { type: string }
        topic: { type: string }
        archived: { type: boolean }
    ConversationMemberChange:
      type: object
      properties:
        notify: { type: string, enum: [all, mentions, none] }
        role: { type: string, enum: [owner, member] }
    ReadMarker:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64, minimum: 0 }
    NewMessage:
      type: object
      properties:
        body: { type: string, description: "Markdown; up to 40000 characters" }
        clientId: { type: string, maxLength: 200, description: "the sender's idempotency key, unique per sender in the conversation" }
        mentions: { type: array, items: { $ref: "#/components/schemas/MemberRef" } }
        attachments: { type: array, items: { type: string, format: uuid }, description: "files the sender uploaded into this conversation (POST /attachments) and has not sent yet" }
    MessagePatch:
      type: object
      required: [body]
      properties:
        body: { type: string }
    Message:
      type: object
      required: [id, conversationId, seq, authorKind, kind, body, replyCount, status, origin, createdAt, mentions, reactions, attachments]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        authorKind: { type: string, enum: [user, agent, system, plugin, external] }
        authorId: { type: string, format: uuid }
        kind: { type: string, enum: [text, card] }
        body: { type: string, description: "Markdown; empty once deleted" }
        cardType: { type: string, description: "task | decision | job | artifact | consent | task_proposal | pr | incident | release | brain_proposal" }
        card: { $ref: "#/components/schemas/Card" }
        replyCount: { type: integer }
        threadId: { type: string, format: uuid, description: "the thread under this message, once opened" }
        status: { type: string, enum: [streaming, final, failed], description: "streaming while an agent is still writing it (message.edited as it grows), failed when its turn could not answer" }
        origin: { $ref: "#/components/schemas/MessageOrigin" }
        clientId: { type: string }
        editedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        mentions: { type: array, items: { $ref: "#/components/schemas/MemberRef" } }
        reactions: { type: array, items: { $ref: "#/components/schemas/Reaction" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" }, description: "none once deleted" }
        turn: { $ref: "#/components/schemas/MessageTurn" }
    Agent:
      type: object
      description: "A member of the team that is an agent: an identity people mention, a role it plays in the process, what it may touch, and its state."
      required: [id, handle, displayName, description, avatar, instructions, tier, policy, tools, skills, status, source, builtin, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: absent for a workspace agent }
        handle: { type: string, description: "what people type after @; 2–32 of a–z, 0–9 and '-'" }
        displayName: { type: string }
        description: { type: string, description: "one line, shown in @autocomplete" }
        avatar: { type: string, description: "an SF Symbol, an emoji or a url" }
        roleKey: { type: string, description: "the process role it plays: researcher, planner, worker, reviewer, security_reviewer, curator, triage, reporter, …" }
        instructions: { type: string, description: "its own prompt; empty means its role's" }
        tier: { type: string, enum: [chat, work], description: "chat reads and answers with no tools that write; work changes code on a gator/ branch, where a person allowed agents on the task" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        tools: { type: array, items: { type: string }, description: "the remote MCP servers it may call through Gator's proxy: a server's name, or server/tool" }
        skills: { type: array, items: { type: string }, description: "the skills it carries, by name; a job of it gets them in its lease" }
        status: { type: string, enum: [active, paused], description: "a paused agent refuses turns and says so" }
        source: { type: object, additionalProperties: true, description: "{kind: builtin | custom | marketplace, …}" }
        builtin: { type: boolean, description: "one of every project's defaults: paused, never deleted" }
        kind: { type: string, enum: [local, remote], x-enum-varnames: [AgentKindLocal, AgentKindRemote], description: "local runs on a runner; remote is an agent outside Gator, asked over A2A" }
        remote: { $ref: "#/components/schemas/RemoteAgentInfo" }
        a2aExposed: { type: boolean, description: "shown to the project's A2A clients" }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentPolicy:
      type: object
      description: "The agent's own backend, model and cost cap per turn, over the project's policy for its role and tier; empty takes the project's."
      properties:
        backend: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}(:[a-z][a-z0-9-]{0,31})?$", description: "claude, or acp:<agent> for an agent speaking the Agent Client Protocol through a runner (acp:codex, acp:gemini); a job waits for a runner with that backend logged in" }
        model: { type: string }
        maxCostUsd: { type: number, format: double }
        dailyBudgetUsd: { type: number, format: double, description: "what the agent may spend in a UTC day, jobs still running counted at their cap; absent: only the project's budget" }
        approvals: { $ref: "#/components/schemas/ApprovalsPolicy" }
    ApprovalsPolicy:
      type: object
      description: |
        Tools of a work turn that wait for a person (process_config.policy.approvals; an agent's own
        policy only tightens the project's: its rules are added, its timeout counts when shorter). A
        rule is Tool, Tool(pattern) — Bash(curl:*) is any command starting with the word curl,
        anywhere in a pipeline or a chain; a pattern ending in * is a prefix — or mcp:<server>/<tool>
        with * for every tool of a server. A project that says nothing asks about Bash(curl:*),
        Bash(wget:*) and Bash(git push:*), with 30m to answer. A request nobody answers is refused.
      properties:
        ask: { type: array, items: { type: string } }
        deny: { type: array, items: { type: string } }
        timeout: { type: string, description: "a duration, 1m to 24h; default 30m" }
        onTimeout: { type: string, enum: [deny] }
    NewAgent:
      type: object
      required: [handle, displayName]
      properties:
        handle: { type: string }
        displayName: { type: string }
        description: { type: string }
        avatar: { type: string }
        roleKey: { type: string }
        instructions: { type: string }
        tier: { type: string, enum: [chat, work], default: chat }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
    AgentPatch:
      type: object
      description: fields left out stay as they are
      properties:
        handle: { type: string, description: "not for a built-in agent" }
        displayName: { type: string }
        description: { type: string }
        avatar: { type: string }
        roleKey: { type: string, description: "not for a built-in agent" }
        instructions: { type: string }
        tier: { type: string, enum: [chat, work] }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        status: { type: string, enum: [active, paused] }
        skills: { type: array, items: { type: string }, description: "the skills it carries, by name: the project's own skill of that name before the workspace's" }
        tools: { type: array, items: { type: string }, description: "the remote MCP servers it may call through Gator's proxy: a server's name (every tool its allowlist holds) or server/tool" }
    AgentProfile:
      type: object
      required: [agent, stats]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        stats: { $ref: "#/components/schemas/AgentStats" }
    AgentStats:
      type: object
      description: "Its record since a moment, 30 days by default: turns asked of it, jobs it did (phase work and answers), how many of those that ended ended done, and what they cost. A workspace agent's record spans every project and is shown to workspace admins only; others get zeros."
      required: [since, turns, refused, jobs, done, ended, doneShare, costUsd]
      properties:
        since: { type: string, format: date-time }
        turns: { type: integer }
        refused: { type: integer }
        jobs: { type: integer }
        done: { type: integer }
        ended: { type: integer }
        doneShare: { type: number, format: double, description: "done over ended; 0 with nothing ended" }
        costUsd: { type: number, format: double }
    AgentTurn:
      type: object
      description: "One answer of one agent to one call: a mention, a message in a DM, a delegation, an escalation a person allowed. A refused call is a turn too, with its refusal."
      required: [id, agentId, projectId, conversationId, requestedByKind, chainId, hop, tier, status, createdAt, costUsd, durationMs]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid, description: where the answer goes }
        triggerMessageId: { type: string, format: uuid, description: the message that asked }
        replyMessageId: { type: string, format: uuid, description: the agent's answer }
        requestedByKind: { type: string, enum: [user, agent, automation, process, external], description: "external: somebody outside the workspace (a bridge's outside identity, an A2A client), answered in chat" }
        requestedBy: { type: string, format: uuid, description: the person or the agent who asked }
        onBehalfOf: { type: string, format: uuid, description: the person at the start of the chain }
        chainId: { type: string, format: uuid, description: shared by agent-to-agent delegations }
        parentTurnId: { type: string, format: uuid, description: the turn that delegated this one }
        escalatedFrom: { type: string, format: uuid, description: the chat turn a person let work }
        hop: { type: integer, description: "0 for a person's call; a chain stops at 4 turns" }
        tier: { type: string, enum: [chat, work] }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed, refused, stopped] }
        refusal: { type: string, description: "paused | no_access | hop_limit | repeat | fan_out | chain_budget | agent_budget | budget | no_task" }
        costUsd: { type: number, format: double }
        durationMs: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    MessageTurn:
      type: object
      description: "The agent's turn a message is the answer of: what a client shows under it (state, cost, time) and what Stop acts on."
      required: [id, agentId, status, tier, costUsd, durationMs, costEstimated]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed, refused, stopped] }
        tier: { type: string, enum: [chat, work] }
        jobId: { type: string, format: uuid }
        refusal: { type: string, description: "why it did not run: paused | no_access | hop_limit | repeat | fan_out | chain_budget | agent_budget | budget | no_task" }
        costUsd: { type: number, format: double }
        durationMs: { type: integer, format: int64 }
        costEstimated: { type: boolean, description: "priced from list rates (a subscription), not billed" }
    Reaction:
      type: object
      required: [emoji, count, members]
      properties:
        emoji: { type: string }
        count: { type: integer }
        members: { type: array, items: { $ref: "#/components/schemas/MemberRef" } }
    Attachment:
      type: object
      required: [id, conversationId, name, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid, description: absent until the message that carries it is posted }
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    Card:
      type: object
      required: [ref]
      additionalProperties: true
      description: >-
        What a card shows. It points at an object (ref) whose current state a client reads; the
        rest is a summary for the list. Its buttons call the endpoints the object already has.
      properties:
        ref: { $ref: "#/components/schemas/CardRef" }
        title: { type: string }
        state: { type: string }
        summary: { type: string }
        actions: { type: array, items: { type: string } }
        day: { type: string, description: "brain_proposal: the day (YYYY-MM-DD) whose proposals the card lists" }
        proposals: { type: array, items: { $ref: "#/components/schemas/BrainCardProposal" }, description: "brain_proposal: what the Brain was proposed from the task that day" }
        changes: { $ref: "#/components/schemas/CardChanges" }
    CardChanges:
      type: object
      description: "job: what the job changed so far, from its last checkpoint (a line under the card, and the diff action: GET /jobs/{id}/diff)"
      required: [files, added, removed, line]
      properties:
        files: { type: integer }
        added: { type: integer }
        removed: { type: integer }
        line: { type: string, description: "e.g. \"3 files, +42 −7\"" }
    BrainCardProposal:
      type: object
      required: [id, kind, scope, title, status]
      description: "one proposal of a brain_proposal card; approve and reject call /brain/{id}/approve and /brain/{id}/reject"
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BrainKind" }
        scope: { $ref: "#/components/schemas/BrainScope" }
        component: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/BrainStatus" }
        replaces: { type: array, items: { type: string, format: uuid }, description: "approved decisions it contradicts: approving it supersedes them (\"does this replace X?\")" }
        actions: { type: array, items: { type: string, enum: [approve, reject] } }
    CardRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, description: "task | job | artifact | turn | task_proposal | pr | incident | release | brain_entry | brain_proposal" }
        id: { type: string }
        taskId: { type: string, format: uuid }
    MessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        hasMore: { type: boolean }
    PromoteMessage:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [feature, bug, chore, incident] }
        title: { type: string, description: "defaults to the message's first line" }
        projectId: { type: string, format: uuid, description: "only for a message in a DM outside every project" }
    PromotedMessage:
      type: object
      required: [task, conversationId]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        conversationId: { type: string, format: uuid, description: "the task's thread: the conversation the message started or is in" }
    MessageHit:
      type: object
      required: [message, conversation]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        conversation: { $ref: "#/components/schemas/Conversation" }
    Registry:
      type: object
      required: [id, name, signed, builtin, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, description: "workspace admins only; a credential in it is never shown" }
        publicKey: { type: string, description: "the keys its index is signed with (ed25519:<base64>, comma-separated)" }
        signed: { type: boolean, description: "false: an unsigned registry, whose packages only their checksums vouch for" }
        builtin: { type: boolean, description: "Gator's own; it follows the server's configuration" }
        fetchedAt: { type: string, format: date-time }
        fetchError: { type: string, description: "workspace admins only: why the last fetch failed or what it turned away; empty when all was well" }
        createdAt: { type: string, format: date-time }
    NewRegistry:
      type: object
      required: [name, url]
      properties:
        name: { type: string, description: "lowercase letters, digits and dashes" }
        url: { type: string, description: "a git repository (https or ssh), or file:// a directory on the server (signed registries only)" }
        publicKey: { type: string, description: "ed25519:<base64>; empty: an unsigned registry, which must be fetched over https or ssh and is shown as untrusted" }
    RegistryFetch:
      type: object
      required: [registry, fetched, rejected]
      properties:
        registry: { $ref: "#/components/schemas/Registry" }
        fetched: { type: array, items: { $ref: "#/components/schemas/PackageRef" } }
        rejected: { type: array, items: { $ref: "#/components/schemas/RejectedPackage" } }
    PackageRef:
      type: object
      required: [kind, name, version]
      properties:
        kind: { type: string, enum: [agent, skill, integration, process, knowledge] }
        name: { type: string }
        version: { type: string }
    RejectedPackage:
      type: object
      required: [kind, name, version, reason]
      properties:
        kind: { type: string }
        name: { type: string }
        version: { type: string }
        reason: { type: string }
    PackageManifest:
      type: object
      description: "What a package says about itself, the same for every kind."
      required: [kind, name, version, displayName, description, permissions, requires]
      properties:
        kind: { type: string, enum: [agent, skill, integration, process, knowledge] }
        name: { type: string }
        version: { type: string }
        displayName: { type: string }
        description: { type: string }
        phases: { type: array, items: { type: string } }
        icon: { type: string, description: "a file of the package (assets/icon.png) or an SF Symbol" }
        examplePrompt: { type: string }
        readme: { type: string, description: "only in a package's details" }
        permissions: { type: array, items: { type: string }, description: "what installing it lets it do, one line each; installing accepts exactly these" }
        requires: { $ref: "#/components/schemas/PackageRequires" }
        detail: { type: object, additionalProperties: true, description: "the kind's own manifest (agent.yaml, SKILL.md frontmatter, integration.yaml, process.yaml, pack.json), only in a package's details" }
    PackageRequires:
      type: object
      properties:
        capabilities: { type: array, items: { type: string }, description: "plugin capabilities: vcs, ci, deploy, monitoring, tracker …" }
        mcp: { type: array, items: { type: string }, description: "remote MCP servers by name" }
        skills: { type: array, items: { type: string }, description: "skills it uses and does not bring" }
    MarketplaceItem:
      type: object
      required: [registryId, registryName, trusted, manifest, checksum, versions]
      properties:
        registryId: { type: string, format: uuid }
        registryName: { type: string }
        trusted: { type: boolean, description: "false: from an unsigned registry, which nothing but its checksums vouches for; show it as untrusted" }
        manifest: { $ref: "#/components/schemas/PackageManifest" }
        checksum: { type: string }
        versions: { type: array, items: { type: string }, description: "every version offered, newest first" }
        installed: { $ref: "#/components/schemas/InstalledRef" }
        missing: { type: array, items: { type: string }, description: "with projectId: what the project lacks to run it (capabilities, MCP servers, skills)" }
    InstalledRef:
      type: object
      description: "What a project (or the workspace) has installed of a package, and whether a newer version waits for a person."
      required: [installationId, version, updateAvailable]
      properties:
        installationId: { type: string, format: uuid }
        version: { type: string }
        updateAvailable: { type: boolean }
        workspace: { type: boolean, description: "installed for the whole workspace rather than this project" }
    MarketplaceDetail:
      type: object
      required: [registryId, registryName, trusted, manifest, checksum, files, versions]
      properties:
        registryId: { type: string, format: uuid }
        registryName: { type: string }
        trusted: { type: boolean, description: "false: from an unsigned registry" }
        manifest: { $ref: "#/components/schemas/PackageManifest" }
        checksum: { type: string }
        files: { type: array, items: { type: string }, description: "the package's files, by path" }
        versions: { type: array, items: { $ref: "#/components/schemas/PackageVersion" } }
        installed: { $ref: "#/components/schemas/InstalledRef" }
        missing: { type: array, items: { type: string } }
    PackageVersion:
      type: object
      required: [version, checksum, listed, permissions]
      properties:
        version: { type: string }
        checksum: { type: string }
        listed: { type: boolean, description: "false: the registry no longer offers it; it stays where it is installed" }
        permissions: { type: array, items: { type: string } }
    NewInstallation:
      type: object
      description: "Exactly the package the person looked at: a name two registries offer, a version published since, or the same version with other files is not what they accepted, and is refused (409)."
      required: [kind, name, registryId, version, checksum, acceptedPermissions]
      properties:
        kind: { type: string, enum: [agent, skill, integration, process, knowledge] }
        name: { type: string }
        version: { type: string }
        registryId: { type: string, format: uuid }
        checksum: { type: string, description: "the version's checksum, as the details showed it" }
        acceptedPermissions: { type: array, items: { type: string }, description: "the permissions the person ticked, as the package words them" }
        handle: { type: string, description: "an agent's handle, when the suggested one is taken" }
    Installation:
      type: object
      required: [id, registryId, kind, name, version, checksum, acceptedPermissions, installedBy, installedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: "absent: installed for the workspace" }
        registryId: { type: string, format: uuid }
        kind: { type: string, enum: [agent, skill, integration, process, knowledge] }
        name: { type: string }
        version: { type: string }
        checksum: { type: string }
        targetId: { type: string, format: uuid, description: "what it made: the agent, skill, MCP server, plugin or knowledge pack" }
        acceptedPermissions: { type: array, items: { type: string } }
        installedBy: { type: string, format: uuid }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updateAvailable: { type: string, description: "the newest version offered, when it is newer than this one" }
        missing: { type: array, items: { type: string }, description: "what the project lacks to run it" }
        agent: { $ref: "#/components/schemas/Agent" }
    InstallRefusal:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, description: "permissions_not_accepted | conflict" }
        permissions: { type: array, items: { type: string }, description: "with permissions_not_accepted: what is still to accept" }
        localChanges: { type: array, items: { $ref: "#/components/schemas/LocalChange" }, description: "with local_changes: what a person changed, and what the new version would" }
    SkillInfo:
      type: object
      description: "A skill: a folder in the Agent Skills format (SKILL.md, scripts/, references/, assets/). A job of an agent that carries it gets it whole; Claude Code loads it by itself, other backends read it through skill_read."
      required: [id, name, version, description, files, source]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: "absent: every project's" }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        files: { type: array, items: { type: string } }
        source: { type: object, additionalProperties: true, description: "{kind: marketplace, registry, package, version, agent?}: agent is the agent package that brought it" }
    McpServer:
      type: object
      description: "A remote MCP server agents reach through Gator's proxy (/mcp/proxy/<name>, with a job's own token); its credentials never leave the server."
      required: [id, name, displayName, url, auth, allowedTools, readOnlyTools, enabled, connected, secretsSet, breaker, workspace, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: "absent: the workspace's" }
        name: { type: string, description: "what agents' tools are named after: mcp__<name>__<tool>" }
        displayName: { type: string }
        url: { type: string }
        auth: { type: string, enum: [oauth, bearer, none] }
        allowedTools: { type: array, items: { type: string }, description: "the tools agents may call; the rest are off until an admin switches them on" }
        readOnlyTools: { type: array, items: { type: string }, description: "of those, the ones chat agents (and any job of a chat agent) may call: read-only as the admin or the package said when allowing them, not as the server says live" }
        enabled: { type: boolean }
        connected: { type: boolean, description: "it has what it needs to be called: a token, or nothing at all" }
        secretsSet: { type: array, items: { type: string }, description: "which credentials are set, never their values" }
        breaker: { type: string, enum: [closed, open, half-open], description: "open: it failed too often lately, and is not called for a while" }
        workspace: { type: boolean }
        source: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    McpServerSettings:
      type: object
      description: fields left out stay as they are
      properties:
        displayName: { type: string }
        url: { type: string, description: "https, or http to localhost" }
        auth: { type: string, enum: [bearer, none], description: "only when making a server" }
        allowedTools: { type: array, items: { type: string } }
        readOnlyTools: { type: array, items: { type: string }, description: "the allowed tools chat agents may call; left out while allowedTools changes, what the server marks read-only at that moment" }
        enabled: { type: boolean }
        secrets: { type: object, additionalProperties: { type: string }, description: "credentials, e.g. {token: …}; an empty value removes one" }
    McpTool:
      type: object
      required: [name, description, readOnly, allowed, chat]
      properties:
        name: { type: string }
        description: { type: string }
        readOnly: { type: boolean, description: "the server marks it read-only, now" }
        allowed: { type: boolean }
        chat: { type: boolean, description: "chat agents may call it: allowed, and in readOnlyTools" }
    McpCall:
      type: object
      required: [id, method, tool, outcome, resultBytes, durationMs, createdAt]
      properties:
        id: { type: integer, format: int64 }
        jobId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        method: { type: string, description: "tools/list or tools/call" }
        tool: { type: string }
        payload: { type: object, additionalProperties: true, description: "the arguments, anything that looks like a secret masked" }
        outcome: { type: string, enum: [ok, error, denied, open], description: "denied: the allowlist refused it; open: the breaker did" }
        error: { type: string }
        resultBytes: { type: integer }
        durationMs: { type: integer }
        createdAt: { type: string, format: date-time }
    InstallationUpdate:
      type: object
      required: [version, checksum]
      properties:
        version: { type: string, description: "the version previewed, in the installation's registry" }
        checksum: { type: string, description: "its checksum, as the preview showed it" }
        acceptedPermissions: { type: array, items: { type: string }, description: "accepted now; with what was accepted before, every permission of the new version" }
        resolve: { type: string, enum: [keep_local, take_theirs], description: "what becomes of what a person changed since installing" }
        downgrade: { type: boolean, description: "a version older than the one installed is refused (400) unless this says so" }
    UpdatePreview:
      type: object
      required: [from, to, checksum, addedPermissions, removedPermissions, needsAcceptance, localChanges]
      properties:
        from: { type: string }
        to: { type: string }
        checksum: { type: string, description: "the checksum of the version previewed, to name in the update" }
        addedPermissions: { type: array, items: { type: string }, description: "asked for by the new version and never accepted: to accept again" }
        removedPermissions: { type: array, items: { type: string } }
        needsAcceptance: { type: boolean }
        localChanges: { type: array, items: { $ref: "#/components/schemas/LocalChange" } }
    LocalChange:
      type: object
      required: [part, local, incoming]
      properties:
        part: { type: string, description: "instructions, SKILL.md, template" }
        local: { type: string, description: "a unified diff: what was installed → what it is now" }
        incoming: { type: string, description: "a unified diff: what was installed → what the new version has" }
