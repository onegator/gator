version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/server/store/migrations"
    queries: "internal/server/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/server/store/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
