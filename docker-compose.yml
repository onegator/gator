services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gator
      POSTGRES_PASSWORD: gator
      POSTGRES_DB: gator
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gator"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
