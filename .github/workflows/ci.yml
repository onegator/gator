name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gator
          POSTGRES_PASSWORD: gator
          POSTGRES_DB: gator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gator" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GATOR_DATABASE_URL: postgres://gator:gator@localhost:5432/gator?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/gator-server migrate
      - run: go run ./cmd/gator-server migrate-down
      - run: go run ./cmd/gator-server migrate
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check
