kind: bug
max_rollbacks: 2
phases:
  - { name: planning,       owner: runner, role: planner,  gate: human, timeout: 12h }
  - { name: implementation, owner: runner, role: worker,   gate: both,  timeout: 24h }
  - { name: verification,   owner: runner, role: reviewer, gate: human, timeout: 12h }
  - { name: approved,       owner: human,  gate: auto,     timeout: 0 }
  - { name: release,        owner: plugin, gate: auto,     timeout: 24h, requires: deploy }
