version: 2
project_name: gator
builds:
  - id: gator-server
    main: ./cmd/gator-server
    binary: gator-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/onegator/gator/internal/version.Version={{.Version}}
      - -X github.com/onegator/gator/internal/version.Commit={{.ShortCommit}}
      - -X github.com/onegator/gator/internal/version.Date={{.Date}}
  - id: gator-runner
    main: ./cmd/gator-runner
    binary: gator-runner
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/onegator/gator/internal/version.Version={{.Version}}
      - -X github.com/onegator/gator/internal/version.Commit={{.ShortCommit}}
      - -X github.com/onegator/gator/internal/version.Date={{.Date}}
  # Plugins ship with the server they talk to, so a release never pairs a plugin with a
  # protocol it was not built against. The binary name is what the install command points at.
  - id: plugin-github
    main: ./plugins/github
    binary: github
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
  - id: plugin-sentry
    main: ./plugins/sentry
    binary: sentry
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
  - id: plugin-honeybadger
    main: ./plugins/honeybadger
    binary: honeybadger
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
  - id: plugin-linear
    main: ./plugins/linear
    binary: linear
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
archives:
  - id: server
    ids: [gator-server]
    name_template: "gator-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - deploy/install.sh
      - deploy/server.env.example
      - deploy/systemd/gator-server.service
      - deploy/caddy/Caddyfile
      - docs/deploy.md
  - id: runner
    ids: [gator-runner]
    name_template: "gator-runner_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - deploy/install.sh
      - deploy/runner.env.example
      - deploy/systemd/gator-runner.service
      - deploy/launchd/dev.onegator.gator-runner.plist
      - docs/deploy.md
  - id: plugins
    ids: [plugin-github, plugin-sentry, plugin-honeybadger, plugin-linear]
    name_template: "gator-plugins_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - plugins/README.md
      - plugins/*/README.md
checksum:
  name_template: checksums.txt
release:
  extra_files:
    - glob: docs/openapi.yaml
    - glob: deploy/install.sh
    - glob: deploy/compose.yaml
